<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1A4FA0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SalesData">
<title>SalesData</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<style>
  :root{
    --brand:#1A4FA0; --brand-dark:#123A78; --accent:#F5C84C; --ink:#1A1A1A; --muted:#6B6B6B;
    --bg:#F4F2EF; --card:#FFFFFF; --line:#E3DFDA;
    --green:#1E9E4A; --orange:#E07B00; --red:#D0212B;
    --radius:16px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
       background:var(--bg);color:var(--ink);font-size:17px;line-height:1.4}
  .wrap{max-width:480px;margin:0 auto;padding:0 16px calc(24px + env(safe-area-inset-bottom))}
  header{background:var(--brand);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 14px}
  .hdr{max-width:480px;margin:0 auto;display:flex;align-items:center;gap:12px}
  .logo{height:58px;width:auto;max-width:90px;object-fit:contain;background:#fff;border-radius:12px;padding:3px 5px}
  .hero{display:block;width:72%;max-width:260px;margin:2px auto 10px}
  .logo-fallback{display:none;font-weight:900;letter-spacing:.5px;line-height:1;font-size:14px;
       background:#fff;color:var(--brand);border-radius:10px;padding:7px 9px;text-align:center}
  .who{flex:1;min-width:0}
  .who .name{font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .who .user{font-size:13px;opacity:.85}
  .hbtns{display:flex;gap:6px}
  .chip{border:1px solid rgba(255,255,255,.6);background:transparent;color:#fff;border-radius:999px;
        padding:6px 10px;font-size:13px;font-weight:600}
  .card{background:var(--card);border-radius:var(--radius);padding:18px;margin-top:14px;border:1px solid var(--line)}
  h1{font-size:22px;margin:4px 0 2px}
  .sub{color:var(--muted);font-size:14px;margin:0}
  label{display:block;font-weight:700;margin:14px 0 6px}
  input{width:100%;font-size:22px;padding:14px;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
  input:focus{outline:none;border-color:var(--brand)}
  input.big{font-size:40px;font-weight:800;text-align:center;letter-spacing:1px}
  input.pin{letter-spacing:12px;text-align:center;font-weight:800}
  .hint{font-size:13px;color:var(--muted);margin-top:6px}
  .err{color:var(--red);font-size:14px;font-weight:600;margin-top:8px;min-height:1em}
  .btn{display:block;width:100%;border:0;border-radius:14px;padding:17px;font-size:19px;font-weight:800;
       background:var(--brand);color:#fff;margin-top:16px}
  .btn:active{background:var(--brand-dark)}
  .btn:disabled{background:#C9C4BE;color:#fff}
  .btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--line)}
  .btn.green{background:var(--green)}
  .row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:0}
  .row .k{color:var(--muted)} .row .v{font-weight:700;text-align:right;word-break:break-word}
  /* GPS */
  .gps{display:flex;gap:12px;align-items:center}
  .dot{width:22px;height:22px;border-radius:50%;flex:none;background:#BBB;box-shadow:0 0 0 5px rgba(0,0,0,.06)}
  .dot.green{background:var(--green);box-shadow:0 0 0 5px rgba(30,158,74,.18)}
  .dot.orange{background:var(--orange);box-shadow:0 0 0 5px rgba(224,123,0,.18)}
  .dot.red{background:var(--red);box-shadow:0 0 0 5px rgba(208,33,43,.18)}
  .dot.wait{animation:pulse 1.2s infinite}
  @keyframes pulse{50%{opacity:.35}}
  .gps .t{font-weight:800}
  .gps .d{font-size:13px;color:var(--muted)}
  .legend{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;font-size:13px;margin-top:12px;
          padding-top:12px;border-top:1px dashed var(--line);align-items:center}
  .legend i{display:inline-block;width:12px;height:12px;border-radius:50%}
  .big-num{font-size:46px;font-weight:900;text-align:center;color:var(--brand);margin:6px 0}
  .center{text-align:center}
  .tick{width:84px;height:84px;border-radius:50%;background:var(--green);color:#fff;font-size:50px;
        display:flex;align-items:center;justify-content:center;margin:10px auto}
  .tick.amber{background:var(--orange)}
  .banner{background:#FFF4E0;border:1px solid #F3C98A;color:#7A4A00;border-radius:12px;padding:10px 12px;
          font-size:14px;margin-top:14px;display:none}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center;z-index:9}
  .modal .box{background:#fff;width:100%;max-width:480px;border-radius:20px 20px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom))}
  .hidden{display:none!important}
  .tagline{background:#0F2F63;color:#F5C84C;text-align:center;font-size:clamp(10.5px,2.9vw,13px);font-weight:700;
           padding:7px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mission{position:fixed;inset:0;z-index:10;background:linear-gradient(170deg,#1A4FA0 0%,#0F2F63 100%);
           color:#fff;display:none;flex-direction:column;overflow-y:auto;
           padding:calc(28px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom))}
  .mission .in{max-width:440px;margin:auto;width:100%;text-align:center}
  .mission img{width:62%;max-width:230px;background:#fff;border-radius:20px;padding:10px 12px;margin-bottom:22px}
  .mission .hello{font-size:18px;opacity:.9;margin-bottom:14px}
  .mission .msg{font-size:24px;line-height:1.45;font-weight:700;text-align:left}
  .mission .msg b{color:#FFE7A3}
  .mission .ok{background:#fff;color:var(--brand);margin-top:30px;font-size:22px}
  .tabs{display:flex;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
  .tabs button{flex:1;border:0;background:transparent;padding:12px 6px;font-size:15.5px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent}
  .tabs button.on{color:var(--brand);border-bottom-color:var(--brand)}
  .tabs .badge{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--orange);color:#fff;font-size:11.5px;margin-left:4px;vertical-align:2px}
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
  .tile .l{font-size:13px;color:var(--muted);font-weight:600}
  .tile .v{font-size:34px;font-weight:900;color:var(--ink);line-height:1.1;margin-top:4px}
  .tile .u{font-size:13px;color:var(--muted)}
  .tile .d{font-size:12.5px;color:var(--muted);margin-top:4px}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;gap:6px}
  .stats b{display:block;font-size:20px} .stats span{font-size:12px;color:var(--muted)}
  .ctitle{font-weight:800;font-size:16px;margin:0 0 2px} .csub{font-size:12.5px;color:var(--muted);margin:0 0 10px}
  .mbar{fill:var(--brand)} .mbar.today{fill:var(--accent)} .maxis{fill:var(--muted);font-size:10px}
  .dayh{font-size:13px;font-weight:800;color:var(--muted);margin:14px 0 4px;display:flex;justify-content:space-between}
  .ent{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
  .ent:last-child{border-bottom:0}
  .ent .tm{font-weight:700;width:48px;flex:none;font-size:15px}
  .ent .bx{flex:1;min-width:0}
  .ent .bx b{font-size:18px}
  .ent .st{font-size:12.5px;color:var(--muted);margin-top:2px}
  .ent.void .bx b{text-decoration:line-through;color:var(--muted)}
  .pill{display:inline-block;font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 8px;margin-right:4px}
  .p-pend{background:#FFF1DB;color:#8A4B00} .p-am{background:#E3EDFB;color:#123A78} .p-void{background:#EEE;color:#555}
  .p-rej{background:#FCE4E4;color:#8F1C1C} .p-q{background:#FFF1DB;color:#8A4B00}
  .rbtn{flex:none;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;font-size:13px;font-weight:700;color:var(--ink)}
  .opt{display:flex;gap:10px;align-items:center;border:2px solid var(--line);border-radius:12px;padding:12px;margin-top:8px;font-weight:700}
  .opt.on{border-color:var(--brand);background:#F1F6FD}
  .opt input{width:auto;margin:0}
  textarea{width:100%;font:inherit;font-size:16px;padding:10px;border:2px solid var(--line);border-radius:12px;min-height:70px}
  .refresh{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--muted);margin-top:12px}
  .refresh button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px 12px;font-weight:700}
  .seg{display:flex;gap:6px;margin:4px 0 2px}
  .seg button{flex:1;border:2px solid var(--line);background:#fff;border-radius:12px;padding:10px 6px;font-weight:800;font-size:14.5px;color:var(--muted)}
  .seg button.on{border-color:var(--brand);color:var(--brand);background:#F1F6FD}
  .seg button.pink.on{border-color:#D6246E;color:#D6246E;background:#FDEFF5}
  select.sel{width:100%;font-size:17px;padding:12px;border:2px solid var(--line);border-radius:12px;background:#fff;font-weight:700}
  .stile .v.neg{color:var(--red)}
  .stile .pend{font-size:12.5px;color:#8A4B00;font-weight:700;margin-top:2px}
  .eom{background:linear-gradient(135deg,#FFF4E0,#FFE7BF);border:1px solid #F3C98A;border-radius:var(--radius);padding:14px;margin-top:12px}
  .eom b{display:block;font-size:16px;color:#6B3A00} .eom p{margin:4px 0 10px;font-size:13.5px;color:#7A4A00}
  .eom.done{background:#E3F4E8;border-color:#B5DDC0} .eom.done b{color:#1B5E20}
  .acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .act{border:1px solid var(--line);background:#fff;border-radius:14px;padding:14px 10px;text-align:left;font-weight:800;font-size:14.5px;color:var(--ink);min-height:64px}
  .act span{display:block;font-size:22px;margin-bottom:2px}
  .act.wide{grid-column:span 2;background:var(--brand);color:#fff;border-color:var(--brand)}
  .dispatch{border:2px dashed var(--brand);border-radius:14px;padding:12px;margin-top:10px;display:flex;gap:10px;align-items:center}
  .dispatch .i{flex:1} .dispatch b{font-size:18px} .dispatch .s{font-size:12.5px;color:var(--muted)}
  .mv{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
  .mv:last-child{border-bottom:0}
  .mv .q{font-weight:900;min-width:58px;text-align:right;font-size:16px}
  .mv .q.in{color:var(--green)} .mv .q.out{color:var(--ink)}
  .mv .x{flex:1;min-width:0} .mv .x .m{color:var(--muted);font-size:12.5px}
  .cmp{display:grid;grid-template-columns:1fr auto auto auto;gap:6px 12px;align-items:center;font-size:15px;margin:12px 0}
  .cmp .h{font-size:12px;color:var(--muted);font-weight:700}
  .cmp .d0{color:var(--green);font-weight:900} .cmp .dn{color:var(--red);font-weight:900}
  .gmini{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-top:10px}
  .gmini .dot{width:12px;height:12px;box-shadow:none}
  .busy{position:fixed;inset:0;z-index:20;background:linear-gradient(170deg,#1A4FA0 0%,#0F2F63 100%);color:#fff;display:none;
        flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
  .busy .spin{width:74px;height:74px;border-radius:50%;border:7px solid rgba(255,255,255,.25);border-top-color:#F5C84C;animation:spin .9s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .busy h2{font-size:26px;margin:22px 0 6px} .busy p{font-size:16px;opacity:.9;margin:0;max-width:320px}
  .busy .bx{font-size:44px;font-weight:900;color:#F5C84C;margin-top:14px}
  .foot{font-size:12px;color:var(--muted);text-align:center;margin-top:18px}
</style>
</head>
<body>

<header>
  <div class="hdr">
    <img class="logo" src="logo.png" alt="Super Horse" onerror="this.style.display='none';document.getElementById('logoFb').style.display='block'">
    <div class="logo-fallback" id="logoFb">SUPER<br>HORSE</div>
    <div class="who">
      <div class="name" id="hName">SalesData</div>
      <div class="user" id="hUser" data-i="appTitle"></div>
    </div>
    <div class="hbtns">
      <a class="chip" id="helpBtn" href="guide-sales.html?from=app" title="Help / Hướng dẫn" aria-label="Help" style="text-decoration:none;font-weight:800;min-width:34px;text-align:center">?</a>
      <button class="chip" id="langBtn">EN</button>
      <button class="chip hidden" id="logoutBtn" data-i="logout"></button>
    </div>
  </div>
</header>
<div class="tagline hidden" id="tagline" data-i="tagline"></div>
<nav class="tabs hidden" id="tabs">
  <button id="tabEntry" class="on" data-i="tabEntry"></button>
  <button id="tabStock"><span data-i="tabStock"></span><span class="badge hidden" id="stockBadge"></span></button>
  <button id="tabMine"><span data-i="tabMine"></span><span class="badge hidden" id="mineBadge"></span></button>
</nav>

<div class="wrap">

  <!-- LOGIN -->
  <section id="vLogin" class="hidden">
    <div class="card">
      <img class="hero" src="logo.png" alt="Super Horse Classic &amp; Pink" onerror="this.remove()">
      <h1 data-i="loginTitle"></h1>
      <p class="sub" data-i="loginSub"></p>
      <label for="uName" data-i="username"></label>
      <input id="uName" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false">
      <label for="uPin" data-i="pin"></label>
      <input id="uPin" class="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="current-password">
      <div class="err" id="loginErr"></div>
      <button class="btn" id="loginBtn" data-i="loginBtn"></button>
      <p class="center" style="margin:14px 0 0"><a href="guide-sales.html?from=app" id="helpLink" style="color:var(--brand);font-weight:700">📖 <span data-i="guideLink"></span></a></p>
    </div>
  </section>

  <!-- ENTRY -->
  <section id="vEntry" class="hidden">
    <div class="banner" id="queueBanner"></div>

    <div class="card">
      <div class="gps">
        <div class="dot wait" id="gDot"></div>
        <div>
          <div class="t" id="gTitle"></div>
          <div class="d" id="gDesc"></div>
        </div>
      </div>
      <div class="legend">
        <i style="background:var(--green)"></i><span data-i="lgGreen"></span>
        <i style="background:var(--orange)"></i><span data-i="lgOrange"></span>
        <i style="background:var(--red)"></i><span data-i="lgRed"></span>
      </div>
      <p class="hint" data-i="gpsWhy"></p>
    </div>

    <div class="card">
      <div id="dl1PickWrap" class="hidden"><label for="dl1Pick" style="margin-top:0" data-i="fromDl1"></label>
        <select id="dl1Pick" class="sel"></select></div>
      <label data-i="productLabel" id="prodLbl"></label>
      <div class="seg" id="prodSeg"><button data-p="SH" class="on">Super Horse Energy Drink</button><button data-p="PINK" class="pink">Super Horse Pink</button></div>
      <label for="boxes" data-i="boxesLabel"></label>
      <input id="boxes" class="big" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" placeholder="0">
      <div class="hint" data-i="boxesHint"></div>
      <div class="err" id="boxErr"></div>
      <button class="btn" id="confirmBtn" disabled data-i="confirm"></button>
      <div class="err center" id="confirmWhy" style="color:var(--muted);font-weight:500"></div>
    </div>
  </section>

  <!-- REVIEW -->
  <section id="vReview" class="hidden">
    <div class="card">
      <h1 data-i="reviewTitle"></h1>
      <p class="sub" data-i="reviewSub"></p>
      <div class="big-num" id="rBoxes"></div>
      <div class="center sub" data-i="boxesUnit"></div>
      <div style="margin-top:14px">
        <div class="row"><span class="k" data-i="rProduct"></span><span class="v" id="rProd"></span></div>
        <div class="row hidden" id="rDl1Row"><span class="k" data-i="fromDl1"></span><span class="v" id="rDl1"></span></div>
        <div class="row"><span class="k" data-i="rEmployee"></span><span class="v" id="rEmp"></span></div>
        <div class="row"><span class="k" data-i="rTime"></span><span class="v" id="rTime"></span></div>
        <div class="row"><span class="k" data-i="rGps"></span><span class="v" id="rGps"></span></div>
        <div class="row"><span class="k" data-i="rAcc"></span><span class="v" id="rAcc"></span></div>
      </div>
      <button class="btn green" id="submitBtn" data-i="submit"></button>
      <button class="btn ghost" id="backBtn" data-i="back"></button>
    </div>
  </section>

  <!-- DONE -->
  <section id="vDone" class="hidden">
    <div class="card center">
      <div class="tick" id="dTick">✓</div>
      <h1 id="dTitle"></h1>
      <p class="sub" id="dSub"></p>
      <div class="big-num" id="dBoxes"></div>
      <button class="btn" id="newBtn" data-i="newEntry"></button>
    </div>
  </section>

  <!-- DL1 STOCK -->
  <section id="vStock" class="hidden">
    <div class="refresh"><span id="kUpd"></span><button id="kRefresh" data-i="refresh"></button></div>
    <div class="err" id="kErr"></div>
    <div id="stockBody"></div>
  </section>

  <!-- MY SALES (read-only) -->
  <section id="vMine" class="hidden">
    <div class="refresh"><span id="mUpd"></span><button id="mRefresh" data-i="refresh"></button></div>
    <div class="err" id="mErr"></div>
    <div id="mineBody"></div>
  </section>

  <div class="foot">SalesData · v4.0</div>
</div>

<!-- Welcome / mission screen (once per login) -->
<div class="mission" id="mission">
  <div class="in">
    <img src="logo.png" alt="Super Horse" onerror="this.remove()">
    <div class="hello" id="mHello"></div>
    <div class="msg" id="mMsg"></div>
    <button class="btn ok" id="mOk">OK</button>
  </div>
</div>

<div id="toast" style="position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#1F1F1F;color:#fff;border-radius:12px;padding:11px 16px;font-weight:700;z-index:25;display:none;max-width:90vw;text-align:center"></div>
<!-- Sending overlay -->
<div class="busy" id="busy" role="alertdialog" aria-live="assertive">
  <div class="spin"></div>
  <h2 id="busyT"></h2><p id="busyS"></p><div class="bx" id="busyB"></div>
</div>

<!-- Stock movement / delivery -->
<div class="modal" id="mvModal">
  <div class="box" style="max-height:94vh;overflow:auto">
    <h1 id="mvTitle"></h1>
    <p class="sub" id="mvSub"></p>
    <div id="mvProdWrap"><label data-i="productLabel"></label>
      <div class="seg" id="mvSeg"><button data-p="SH" class="on">Super Horse Energy Drink</button><button data-p="PINK" class="pink">Super Horse Pink</button></div></div>
    <label for="mvQty" data-i="qtyBoxes"></label>
    <input id="mvQty" class="big" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="5" placeholder="0">
    <label for="mvNote" id="mvNoteLbl"></label>
    <textarea id="mvNote" maxlength="300"></textarea>
    <div class="gmini"><span class="dot" id="mvDot"></span><span id="mvGps"></span></div>
    <div class="err" id="mvErr"></div>
    <button class="btn green" id="mvSend" disabled></button>
    <button class="btn ghost" id="mvClose" data-i="cancel"></button>
  </div>
</div>

<!-- Blind stocktake -->
<div class="modal" id="stModal">
  <div class="box" style="max-height:94vh;overflow:auto">
    <div id="stStep1">
      <h1 id="stTitle"></h1>
      <p class="sub" id="stSub"></p>
      <label for="stSH">Super Horse Energy Drink</label>
      <input id="stSH" class="big" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="0">
      <label for="stPINK">Super Horse Pink</label>
      <input id="stPINK" class="big" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="0">
      <p class="hint" data-i="stBlind"></p>
      <div class="gmini"><span class="dot" id="stDot"></span><span id="stGps"></span></div>
      <div class="err" id="stErr"></div>
      <button class="btn green" id="stSend" disabled data-i="stSend"></button>
      <button class="btn ghost" id="stClose" data-i="cancel"></button>
    </div>
    <div id="stStep2" class="hidden">
      <div class="tick" id="stTick">✓</div>
      <h1 id="stResT" class="center"></h1>
      <p class="sub center" id="stResS"></p>
      <div class="cmp" id="stCmp"></div>
      <div id="stDiffWrap" class="hidden">
        <label for="stReason" data-i="stReason"></label>
        <textarea id="stReason" maxlength="300"></textarea>

/* ---------- storage helpers (safe) ---------- */
const S = {
  get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},
  del(k){try{localStorage.removeItem(k)}catch(e){}}
};
const $ = id => document.getElementById(id);

let lang = S.get('sh_lang','vi');
let session = S.get('sh_session',null);   // {token,username,name,expires}
let gps = {watch:null, best:null, start:0, status:'wait', timer:null};
let pending = null;                        // record being reviewed

function t(k,vars){let s=(T[lang][k]||k);if(vars)for(const x in vars)s=s.replace('{'+x+'}',vars[x]);return s}
function applyLang(){
  document.documentElement.lang=lang;
  document.querySelectorAll('[data-i]').forEach(el=>el.textContent=t(el.dataset.i));
  $('langBtn').textContent = lang==='vi'?'EN':'VI'; $('helpBtn').href=$('helpLink').href='guide-sales.html?from=app&lang='+lang;
  renderHeader(); renderGps(); updateConfirm(); renderQueue(); if(mine) renderMine(); if(stock&&session) renderStock();
  if($('mission').style.display==='flex') showMission();
}
$('langBtn').onclick=()=>{lang=lang==='vi'?'en':'vi';S.set('sh_lang',lang);applyLang()};

/* ---------- views ---------- */
function show(v){
  ['vLogin','vEntry','vReview','vDone','vMine','vStock'].forEach(x=>$(x).classList.toggle('hidden',x!==v));
  $('tagline').classList.toggle('hidden',v==='vLogin');
  $('tabs').classList.toggle('hidden',v==='vLogin'||v==='vReview');
  $('tabEntry').classList.toggle('on',v!=='vMine'&&v!=='vStock'); $('tabMine').classList.toggle('on',v==='vMine'); $('tabStock').classList.toggle('on',v==='vStock');
  if(v==='vMine') loadMine();
  if(v==='vStock') loadStock();
  if(v==='vEntry') fillDl1Pick();
  if(v==='vEntry'||v==='vStock') startGps(); else if(v!=='vReview') stopGps();
  window.scrollTo(0,0);
}

/* ---------- session (daily, midnight Vietnam time) ---------- */
function nextMidnightVN(){
  const off=TZ_OFFSET_H*3600e3, now=Date.now();
  return Math.floor((now+off)/86400e3)*86400e3+86400e3-off;
}
function sessionValid(){return session && session.token && Date.now()<session.expires}
function renderHeader(){
  if(sessionValid()){
    $('hName').textContent=session.name||session.username;
    $('hUser').textContent='@'+session.username;
    $('logoutBtn').classList.remove('hidden');
  }else{
    $('hName').textContent='SalesData';
    $('hUser').textContent=t('appTitle');
    $('logoutBtn').classList.add('hidden');
  }
}
$('logoutBtn').onclick=()=>{session=null;mine=null;stock=null;S.del('sh_session');S.del('sh_mine');S.del('sh_stock');renderHeader();show('vLogin')};

/* ---------- API ---------- */
function busy(on,title,sub,boxes){
  $('busy').style.display=on?'flex':'none';
  if(on){$('busyT').textContent=title||t('pleaseWait');$('busyS').textContent=sub||'';$('busyB').textContent=boxes||''}
}
async function api(payload,timeoutMs){
  const ctl=('AbortController' in window)?new AbortController():null;
  const timer=ctl&&timeoutMs?setTimeout(()=>ctl.abort(),timeoutMs):null;
  let r;
  try{ r=await fetch(API_URL,{method:'POST',body:JSON.stringify(payload),signal:ctl?ctl.signal:undefined}); } // text/plain: no CORS preflight
  finally{ if(timer) clearTimeout(timer); }
  if(!r.ok) throw new Error('http '+r.status);
  return r.json();
}

/* ---------- GPS (runs only while entry screen is open & visible) ---------- */
function startGps(){
  if(gps.watch!==null) return;
  if(!('geolocation' in navigator)){gps.status='none';renderGps();return}
  gps.best=null; gps.start=Date.now(); gps.status='wait';
  gps.watch=navigator.geolocation.watchPosition(onPos,onPosErr,{enableHighAccuracy:true,maximumAge:0,timeout:30000});
  clearInterval(gps.timer); gps.timer=setInterval(()=>{renderGps();updateConfirm()},1000);
  renderGps();
}
function stopGps(){
  if(gps.watch!==null){navigator.geolocation.clearWatch(gps.watch);gps.watch=null}
  clearInterval(gps.timer); gps.timer=null;
}
function onPos(p){
  const c=p.coords, fix={lat:c.latitude,lng:c.longitude,acc:Math.round(c.accuracy),at:Date.now()};
  // keep the most accurate recent fix (fresh within 30 s)
  if(!gps.best || fix.acc<=gps.best.acc || Date.now()-gps.best.at>30000) gps.best=fix;
  renderGps(); updateConfirm();
}
function onPosErr(e){
  if(e.code===1){gps.status='denied';renderGps();updateConfirm()}
}
function band(acc){return acc<=GREEN_M?'green':acc<=ORANGE_M?'orange':'red'}
function renderGps(){
  const dot=$('gDot'), ti=$('gTitle'), de=$('gDesc');
  dot.className='dot';
  if(gps.status==='denied'){dot.classList.add('red');ti.textContent=t('gpsRed');de.textContent=t('gpsDenied');return}
  if(gps.status==='none'){dot.classList.add('red');ti.textContent=t('gpsRed');de.textContent=t('gpsNone');return}
  if(!gps.best){dot.classList.add('wait');ti.textContent=t('gpsWait');de.textContent='';return}
  const b=band(gps.best.acc);
  dot.classList.add(b);
  ti.textContent=t(b==='green'?'gpsGreen':b==='orange'?'gpsOrange':'gpsRed');
  de.textContent=t('gpsAcc',{m:gps.best.acc})+' · '+gps.best.lat.toFixed(6)+', '+gps.best.lng.toFixed(6);
}
function gpsOk(){
  if(!gps.best) return {ok:false,why:t('whyGps')};
  const b=band(gps.best.acc);
  if(b==='green') return {ok:true};
  if(b==='red') return {ok:false,why:t('whyRed')};
  const left=ORANGE_AFTER_S-Math.floor((Date.now()-gps.start)/1000);
  return left<=0?{ok:true}:{ok:false,why:t('whyOrange',{s:left})};
}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden) stopGps();
  else if(!$('vEntry').classList.contains('hidden')||!$('vStock').classList.contains('hidden')) startGps();
});

/* ---------- boxes ---------- */
function boxVal(){const v=$('boxes').value;return /^\d+$/.test(v)?parseInt(v,10):NaN}
function boxesOk(){const n=boxVal();return n>=MIN_BOXES&&n<=MAX_BOXES}
$('boxes').addEventListener('input',e=>{
  e.target.value=e.target.value.replace(/\D/g,'').replace(/^0+/,'').slice(0,4);
  $('boxErr').textContent = e.target.value && !boxesOk() ? t('errBoxes') : '';
  updateConfirm();
});
function updateConfirm(){
  if($('vEntry').classList.contains('hidden')) return;
  const g=gpsOk(), b=boxesOk();
  $('confirmBtn').disabled=!(g.ok&&b);
  $('confirmWhy').textContent = !g.ok ? g.why : (!b ? t('whyBoxes') : '');
}

  const n=boxVal();
  const go=()=>{
    const f=gps.best;
    const myD=dl1sMine(), dl1=myD.length===1?myD[0].code:(myD.length>1?$('dl1Pick').value:'');
    pending={id:uid(),boxes:n,lat:f.lat,lng:f.lng,acc:f.acc,gpsStatus:band(f.acc),deviceTime:new Date().toISOString(),product:prod,dl1:dl1};
    $('rProd').textContent=P[prod]; $('rDl1Row').classList.toggle('hidden',!dl1); $('rDl1').textContent=dl1?dl1Label(dl1):'';
    $('rBoxes').textContent=n.toLocaleString(lang==='vi'?'vi-VN':'en-US');
    $('rEmp').textContent=(session.name||'')+' (@'+session.username+')';
    $('rTime').textContent=fmtTime(new Date(pending.deviceTime));
    $('rGps').textContent=f.lat.toFixed(6)+', '+f.lng.toFixed(6);
    $('rAcc').innerHTML='<span class="dot '+pending.gpsStatus+'" style="display:inline-block;width:12px;height:12px;vertical-align:middle;margin-right:6px;box-shadow:none"></span>±'+f.acc+' m';
    show('vReview');

/* ---------- confirm #2 → submit ---------- */
$('submitBtn').onclick=async()=>{
  if(!pending) return;
  const rec={...pending,token:session.token,username:session.username,name:session.name};
  const b=$('submitBtn'); if(b.disabled) return; b.disabled=true;
  busy(true,t('sending'),t('sendingSub'),rec.boxes.toLocaleString(lang==='vi'?'vi-VN':'en-US')+' '+t('boxesUnit'));
  let sent=false;
  if(navigator.onLine){
    try{
      const res=await api({action:'submit',...rec},15000);   // slow network: give up after 15 s and keep it on the phone
      if(res.ok) sent=true;
      else if(res.error==='auth'){busy(false);alert(t('expired'));session=null;S.del('sh_session');renderHeader();b.disabled=false;show('vLogin');return}
    }catch(e){}
  }
  busy(false);
  if(!sent){rec.offline=true;const q=S.get('sh_queue',[]);q.push(rec);S.set('sh_queue',q)}
  b.disabled=false;
  $('dTick').className='tick'+(sent?'':' amber'); $('dTick').textContent=sent?'✓':'⏳';
  $('dTitle').textContent=t(sent?'doneTitle':'queuedTitle');
  $('dSub').textContent=t(sent?'doneSub':'queuedSub');
  $('dBoxes').textContent=rec.boxes.toLocaleString(lang==='vi'?'vi-VN':'en-US')+' '+t('boxesUnit');
  pending=null; $('boxes').value=''; setProd('SH'); show('vDone'); renderQueue(); if(sent) setTimeout(()=>loadStock(true),500);
};
$('newBtn').onclick=()=>{
  if(!sessionValid()){session=null;S.del('sh_session');renderHeader();show('vLogin');return}
  show('vEntry'); updateConfirm();
};

/* ---------- offline queue ---------- */
let flushing=false;
async function flushQueue(){
  if(flushing||!navigator.onLine) return;
  let q=S.get('sh_queue',[]); if(!q.length) return;
  flushing=true;
  const keep=[];
  for(const rec of q){
    try{
      const res=await api({...rec,action:rec._action||'submit'});
      if(!res.ok){
        if(res.error==='auth'||res.error==='server') keep.push(rec);   // retry later; server ignores duplicates by id
        else { const f=S.get('sh_failed',[]); f.push({rec,error:res.error,at:Date.now()}); S.set('sh_failed',f); }
      }
    }catch(e){keep.push(rec)}
  }
  const sent=keep.length<q.length;
  S.set('sh_queue',keep); flushing=false; renderQueue(); if(sent&&session) loadStock(true);
}
function renderQueue(){
  const n=S.get('sh_queue',[]).length, el=$('queueBanner');
  el.style.display=n?'block':'none'; el.textContent=t('queueN',{n});
}
window.addEventListener('online',flushQueue);
setInterval(()=>{if(!document.hidden)flushQueue()},30000);

function dl1sMine(){ return stock&&session&&stock.u===session.username ? (stock.dl1s||[]) : []; }
function dl1Label(code){ const d=dl1sMine().find(x=>x.code===code); return d?code+' · '+d.name:code; }

  if(list.length<2) return;
  const cur=$('dl1Pick').value||curDl1;

async function loadStock(quiet){
  if(!session) return;
  if(!quiet) renderStock();
  if(!navigator.onLine){ if(!quiet) $('kErr').textContent=stock?t('offlineStock'):t('loadFail'); return; }
  $('kRefresh').disabled=true; if(!quiet) $('kErr').textContent='';
  try{
    const r=await api({action:'stock_home',token:session.token},20000);
    if(r.ok){ stock={...r,u:session.username}; S.set('sh_stock',stock); renderStock(); fillDl1Pick(); }
    else if(r.error==='auth'&&!quiet){ alert(t('expired')); session=null; S.del('sh_session'); renderHeader(); show('vLogin'); }
  }catch(e){ if(!quiet) $('kErr').textContent=stock?t('offlineStock'):t('loadFail'); }
  $('kRefresh').disabled=false;
}
const fmtD=k=>k?k.slice(8,10)+'/'+k.slice(5,7)+'/'+k.slice(0,4):'';
const monthLbl=m=>m.slice(5,7)+'/'+m.slice(0,4);
function renderStock(){
  const list=dl1sMine();
  const failed=S.get('sh_failed',[]).filter(f=>f.rec.username===(session&&session.username));
  let html=failed.length?`<div class="banner" style="display:block">${esc(t('failedN',{n:failed.length}))}</div>`:'';
  if(!list.length){ $('stockBody').innerHTML=html+(stock?`<div class="card"><p class="sub">${esc(t('noDl1'))}</p></div>`:''); $('stockBadge').classList.add('hidden'); return; }
  if(!list.some(d=>d.code===curDl1)) curDl1=list[0].code;
  const d=list.find(x=>x.code===curDl1);
  const queued=S.get('sh_queue',[]).filter(q=>q._action&&q.username===session.username&&q.dl1===d.code);
  const queuedDisp=new Set(queued.filter(q=>q._action==='receive').map(q=>q.dispatchId));
  if(list.length>1) html+=`<select class="sel" id="kDl1" style="margin-top:8px">${list.map(x=>`<option value="${esc(x.code)}"${x.code===d.code?' selected':''}>${esc(x.code+' · '+x.name)}</option>`).join('')}</select>`;
  else html+=`<p class="ctitle" style="margin:10px 0 0">${esc(d.code+' · '+d.name)}</p>`;
  // month-end banner
  if(d.eom){
    if(d.eom.needed) html+=`<div class="eom"><b>📋 ${esc(t('eomT',{m:monthLbl(d.eom.month)}))}</b><p>${esc(t('eomS',{d:fmtD(d.eom.deadline)}))}</p><button class="btn" style="margin:0" id="kEom">${esc(t('eomBtn'))}</button></div>`;
    else html+=`<div class="eom done"><b>${esc(d.eom.status==='Locked'?t('eomLocked',{m:monthLbl(d.eom.month)}):t('eomDone',{m:monthLbl(d.eom.month)}))}</b></div>`;
  }
  // balances
  html+=`<div class="tiles" style="margin-top:12px">${['SH','PINK'].map(p=>{ const b=d.bal[p]||0, pe=d.pend[p]||0;
    return `<div class="tile stile"><div class="l">${esc(P[p])}</div><div class="v${b<0?' neg':''}">${nf(b)}</div><div class="u">${esc(t('boxes'))}</div>${pe?`<div class="pend">${esc(t('pendingN',{n:nf(pe)}))}</div>`:''}${b<0?`<div class="pend" style="color:var(--red)">${esc(t('negWarn'))}</div>`:''}</div>`; }).join('')}</div>`;
  // expected deliveries
  const disp=(d.dispatches||[]).filter(x=>!queuedDisp.has(x.id));
  if(disp.length) html+=`<div class="card"><p class="ctitle">🚚 ${esc(t('expectedT'))}</p>${disp.map(x=>`<div class="dispatch"><div class="i"><b>${nf(x.boxes)}</b> ${esc(t('boxes'))} · ${esc(P[x.p])}<div class="s">${esc(t('dispatchLine',{no:x.noteNo,d:fmtD(x.expected)}))}</div></div><button class="btn" style="margin:0;width:auto;padding:12px 14px" data-recv="${esc(x.id)}">${esc(t('confirmReceive'))}</button></div>`).join('')}</div>`;
  // actions
  html+=`<div class="card"><div class="acts">
    <button class="act wide" data-mv="dl1sale"><span>🛒</span>${esc(t('aSale'))}</button>
    <button class="act" id="kCount"><span>📋</span>${esc(t('aCount'))}</button>
    <button class="act" data-mv="return_hq"><span>↩️</span>${esc(t('aReturn'))}</button>
    <button class="act" data-mv="damaged"><span>⚠️</span>${esc(t('aDamaged'))}</button>
    <button class="act" data-mv="promo"><span>🎁</span>${esc(t('aPromo'))}</button></div>
    <p class="hint" style="margin-top:10px">${esc(d.lastCount?t('lastCount',{d:fmtTime(new Date(d.lastCount.t)),u:d.lastCount.u}):t('neverCounted'))}</p></div>`;
  // recent movements
  const rows=queued.map(q=>({q:true,t:Date.parse(q.deviceTime),n:session.name,u:session.username,type:q.type||'receive',p:q.product,qty:(q.type==='dl1sale'||q.type==='return_hq'||q.type==='damaged'||q.type==='promo'?-1:1)*q.qty,status:'Queued',note:q.note}))
    .concat(d.moves||[]);
  html+=`<div class="card"><p class="ctitle">${esc(t('recentT'))}</p>${rows.length?rows.slice(0,60).map(m=>{
    const pill=m.q?`<span class="pill p-q">⏳ ${esc(t('queuedLbl'))}</span>`:(m.status!=='Posted'?`<span class="pill ${m.status==='Pending'?'p-pend':m.status==='Rejected'?'p-rej':'p-void'}">${esc(t('s_'+m.status))}</span>`:'');
    return `<div class="mv"><div class="q ${m.qty>0?'in':'out'}">${m.qty>0?'+':''}${nf(m.qty)}</div><div class="x"><b>${esc(t('t_'+m.type))}</b> · ${esc(m.p==='PINK'?'Pink':'SH')} ${pill}
      <div class="m">${esc(fmtTime(new Date(m.t)))} · ${esc(m.n||m.u)}${m.note?' · '+esc(m.note):''}${m.reviewNote?' · '+esc(m.reviewNote):''}</div></div></div>`; }).join('')
    :`<p class="sub">—</p>`}
    <p class="hint">${esc(t('teamT'))}: ${(d.team||[]).map(x=>esc(x.n)).join(', ')}</p></div>`;
  $('stockBody').innerHTML=html;
  const pendN=(d.moves||[]).filter(m=>m.status==='Pending').length;
  $('stockBadge').textContent=d.eom&&d.eom.needed?'!':pendN; $('stockBadge').classList.toggle('hidden',!(d.eom&&d.eom.needed)&&!pendN);
  if(stock&&stock.generated) $('kUpd').textContent=t('updatedAt',{t:hm(stock.generated)});
  if($('kDl1')) $('kDl1').onchange=()=>{curDl1=$('kDl1').value;S.set('sh_curDl1',curDl1);renderStock()};
  $('stockBody').querySelectorAll('[data-mv]').forEach(b=>b.onclick=()=>openMove(b.dataset.mv));
  $('stockBody').querySelectorAll('[data-recv]').forEach(b=>b.onclick=()=>openMove('receive',(d.dispatches||[]).find(x=>x.id===b.dataset.recv)));
  if($('kCount')) $('kCount').onclick=()=>openCount('spot');
  if($('kEom')) $('kEom').onclick=()=>openCount('eom');
}

/* GPS for stock forms: green/orange straight away; weak (red) accepted after 60 s and flagged */
function stockGps(since){
  if(!gps.best) return {ok:false,txt:t('gpsMiniWait'),cls:'wait'};
  const b=band(gps.best.acc);
  if(b!=='red') return {ok:true,txt:t('gpsMiniOk',{m:gps.best.acc}),cls:b};
  const left=60-Math.floor((Date.now()-since)/1000);
  return left<=0?{ok:true,txt:t('gpsMiniWeakOk',{m:gps.best.acc}),cls:'red'}:{ok:false,txt:t('gpsMiniWeak',{m:gps.best.acc,s:left}),cls:'red'};
}
function tickMini(){
  if(mv){ const g=stockGps(mv.since); $('mvDot').className='dot '+g.cls; $('mvGps').textContent=g.txt; $('mvSend').disabled=!mvValid(); }
  if(st){ const g=stockGps(st.since); $('stDot').className='dot '+g.cls; $('stGps').textContent=g.txt; $('stSend').disabled=!stValid(); }
}
function openMini(){ startGps(); clearInterval(miniTimer); miniTimer=setInterval(tickMini,1000); tickMini(); }
function closeMini(){ clearInterval(miniTimer); miniTimer=null; }

/* stock movement + receive */
function setMvProd(p){ mv.p=p; document.querySelectorAll('#mvSeg button').forEach(b=>b.classList.toggle('on',b.dataset.p===p)); }
document.querySelectorAll('#mvSeg button').forEach(b=>b.onclick=()=>{setMvProd(b.dataset.p);tickMini()});
function openMove(type,disp){
  const d=dl1sMine().find(x=>x.code===curDl1); if(!d) return;
  mv={type,disp,dl1:d.code,p:disp?disp.p:'SH',since:Date.now()};
  $('mvErr').textContent=''; $('mvNote').value=''; setMvProd(mv.p);
  $('mvProdWrap').classList.toggle('hidden',!!disp);
  const titles={receive:'receiveT',dl1sale:'aSale',return_hq:'aReturn',damaged:'aDamaged',promo:'aPromo'};
  const subs={dl1sale:'saleS',return_hq:'returnS',damaged:'damagedS',promo:'promoS'};
  $('mvTitle').textContent=t(titles[type]);
  $('mvSub').textContent=(disp?t('receiveS',{no:disp.noteNo,p:P[disp.p],n:nf(disp.boxes)}):t(subs[type]))+' · '+d.code+(APPROVE_TYPES.includes(type)?' · '+t('needApproval'):'');
  $('mvQty').value=disp?String(disp.boxes):'';
  $('mvNoteLbl').textContent=t(type==='receive'?'noteShort':type==='dl1sale'?'noteOpt':'noteReq');
  $('mvSend').textContent=t(APPROVE_TYPES.includes(type)?'mvSendApproval':'mvSend');
  $('mvModal').style.display='flex'; openMini(); if(!disp) setTimeout(()=>$('mvQty').focus(),60);
}
function mvValid(){
  if(!mv) return false;
  const v=$('mvQty').value, n=/^\d+$/.test(v)?parseInt(v,10):NaN, note=$('mvNote').value.trim();
  if(mv.type==='receive'){ if(!(n>=0&&n<=20000)) return false; if(n!==mv.disp.boxes&&!note) return false; }
  else { if(!(n>=1&&n<=MAX_BOXES)) return false; if(mv.type!=='dl1sale'&&!note) return false; }
  return stockGps(mv.since).ok;
}
$('mvQty').addEventListener('input',e=>{e.target.value=e.target.value.replace(/\D/g,'').replace(/^0+(?=\d)/,'').slice(0,5);tickMini()});
$('mvNote').addEventListener('input',tickMini);
$('mvClose').onclick=()=>{ $('mvModal').style.display='none'; mv=null; closeMini(); };
$('mvSend').onclick=async()=>{
  if(!mvValid()) return;
  const f=gps.best, n=parseInt($('mvQty').value,10);
  const rec={_action:mv.type==='receive'?'receive':'stock_move',id:uid(),dl1:mv.dl1,product:mv.p,type:mv.type,qty:n,note:$('mvNote').value.trim(),
    dispatchId:mv.disp?mv.disp.id:'',lat:f.lat,lng:f.lng,acc:f.acc,deviceTime:new Date().toISOString(),token:session.token,username:session.username,name:session.name};
  $('mvSend').disabled=true; busy(true,t('sending'),t('sendingSub'),nf(n)+' '+t('boxes'));
  let res=null;
  if(navigator.onLine){ try{ res=await api({...rec,action:rec._action},15000); }catch(e){} }
  busy(false);
  if(res&&!res.ok&&res.error!=='server'){
    if(res.error==='auth'){ alert(t('expired')); session=null; S.del('sh_session'); renderHeader(); $('mvModal').style.display='none'; mv=null; closeMini(); show('vLogin'); return; }
    $('mvErr').textContent=errT(res.error); $('mvSend').disabled=false; return;
  }
  const queued=!res||!res.ok;
  if(queued){ rec.offline=true; const q=S.get('sh_queue',[]); q.push(rec); S.set('sh_queue',q); renderQueue(); }
  $('mvModal').style.display='none'; const ty=mv.type; mv=null; closeMini();
  toast(queued?t('mvQueued'):(APPROVE_TYPES.includes(ty)?t('mvPendOk'):t('mvOk')));
  renderStock(); if(!queued) loadStock(true);
};

/* blind stocktake */
function openCount(kind){
  if(!navigator.onLine){ alert(t('stNeedNet')); return; }
  const d=dl1sMine().find(x=>x.code===curDl1); if(!d) return;
  st={kind,dl1:d.code,since:Date.now(),id:null};
  $('stTitle').textContent=kind==='eom'?t('stTitleEom',{m:monthLbl(d.eom.month),d:d.code}):t('stTitle',{d:d.code});
  $('stSub').textContent=t('stSub'); $('stSH').value=''; $('stPINK').value=''; $('stErr').textContent='';
  $('stStep1').classList.remove('hidden'); $('stStep2').classList.add('hidden');
  $('stModal').style.display='flex'; openMini(); setTimeout(()=>$('stSH').focus(),60);
}
function stValid(){ return st && /^\d+$/.test($('stSH').value) && /^\d+$/.test($('stPINK').value) && stockGps(st.since).ok; }
['stSH','stPINK'].forEach(id=>$(id).addEventListener('input',e=>{e.target.value=e.target.value.replace(/\D/g,'').replace(/^0+(?=\d)/,'').slice(0,6);tickMini()}));
$('stClose').onclick=()=>{ $('stModal').style.display='none'; st=null; closeMini(); };
$('stSend').onclick=async()=>{
  if(!stValid()) return;
  const f=gps.best; $('stSend').disabled=true; busy(true,t('sending'),t('sendingSub'));
  let r=null; try{ r=await api({action:'stocktake',token:session.token,id:uid(),dl1:st.dl1,kind:st.kind,counts:{SH:parseInt($('stSH').value,10),PINK:parseInt($('stPINK').value,10)},lat:f.lat,lng:f.lng,acc:f.acc},20000); }catch(e){}
  busy(false);
  if(!r){ $('stErr').textContent=t('stNeedNet'); $('stSend').disabled=false; return; }
  if(!r.ok){ $('stErr').textContent=errT(r.error); $('stSend').disabled=false; return; }
  st.id=r.stocktakeId; closeMini();
  $('stStep1').classList.add('hidden'); $('stStep2').classList.remove('hidden');
  $('stTick').className='tick'+(r.matched?'':' amber'); $('stTick').textContent=r.matched?'✓':'!';
  $('stResT').textContent=r.matched?t('stMatch'):(r.opening?t('stOpeningT'):t('stDiffT'));
  $('stResS').textContent=r.matched?t('stMatchS'):(r.opening?t('stOpeningS'):t('stDiffS'));
  $('stCmp').innerHTML=`<span class="h">${esc(t('cProduct'))}</span><span class="h">${esc(t('cCounted'))}</span><span class="h">${esc(t('cSystem'))}</span><span class="h">${esc(t('cDiff'))}</span>`+
    ['SH','PINK'].map(p=>{const x=r.result[p];return `<span>${esc(p==='SH'?'Super Horse':'Super Horse Pink')}</span><b>${nf(x.counted)}</b><span>${nf(x.system)}</span><span class="${x.diff?'dn':'d0'}">${x.diff>0?'+':''}${nf(x.diff)}</span>`}).join('');
  $('stDiffWrap').classList.toggle('hidden',r.matched); $('stReason').value=''; $('stErr2').textContent='';
};
$('stReasonSend').onclick=async()=>{
  const note=$('stReason').value.trim(); if(!note){ $('stErr2').textContent=t('err_note_required'); return; }
  $('stReasonSend').disabled=true;
  try{ const r=await api({action:'stocktake_note',token:session.token,stocktakeId:st.id,note},15000); $('stErr2').textContent=r.ok?'':errT(r.error); if(r.ok) toast(t('reasonSent')); }catch(e){ $('stErr2').textContent=t('stNeedNet'); }
  $('stReasonSend').disabled=false;
};
$('stRecount').onclick=async()=>{
  $('stRecount').disabled=true;
  try{ await api({action:'stocktake_recount',token:session.token,stocktakeId:st.id},15000); }catch(e){}
  $('stRecount').disabled=false;
  const kind=st.kind; $('stModal').style.display='none'; st=null; await loadStock(true); openCount(kind);
};
$('stDone').onclick=()=>{ $('stModal').style.display='none'; st=null; closeMini(); loadStock(); };

function errT(e){ const k='err_'+e, v=t(k); return v===k?t('errServer'):v; }
function toast(m){ const el=$('toast'); el.textContent=m; el.style.display='block'; clearTimeout(toast.t); toast.t=setTimeout(()=>el.style.display='none',2800); }

/* ---------- MY SALES (read-only) ---------- */
let mine = S.get('sh_mine', null);          // last loaded copy, so the tab opens instantly
let repEntry = null;
const VN = 7*3600e3;
const dkey = ts => new Date(ts+VN).toISOString().slice(0,10);
const hm = ts => new Date(ts+VN).toISOString().slice(11,16);
const nf = n => Number(n).toLocaleString(lang==='vi'?'vi-VN':'en-US',{maximumFractionDigits:1});
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function dayLabel(k){const [y,m,d]=k.split('-').map(Number);return new Date(Date.UTC(y,m-1,d)).toLocaleDateString(lang==='vi'?'vi-VN':'en-GB',{weekday:'short',day:'2-digit',month:'2-digit',timeZone:'UTC'})}

$('tabEntry').onclick=()=>{ if(!sessionValid()){show('vLogin');return} show('vEntry'); updateConfirm(); };
$('tabMine').onclick=()=>{ if(!sessionValid()){show('vLogin');return} show('vMine'); };
$('mRefresh').onclick=()=>loadMine(true);

async function loadMine(){
  if(mine && mine.u===session.username) renderMine();
  if(!navigator.onLine){ $('mErr').textContent = mine ? '' : t('loadFail'); return; }
  $('mRefresh').disabled=true; $('mErr').textContent='';
  try{
    const r=await api({action:'me',token:session.token});
    if(r.ok){ mine={...r,u:session.username}; S.set('sh_mine',mine); renderMine(); }
    else if(r.error==='auth'){ alert(t('expired')); session=null; S.del('sh_session'); renderHeader(); show('vLogin'); }
    else $('mErr').textContent=t('loadFail');
  }catch(e){ $('mErr').textContent=t('loadFail'); }
  $('mRefresh').disabled=false;
}

function renderMine(){
  if(!mine || !session || mine.u!==session.username){ $('mineBody').innerHTML=''; return; }
  const today=mine.today, mStart=today.slice(0,8)+'01';
  const live=mine.rows.filter(r=>!r.v);
  const todayR=live.filter(r=>dkey(r.t)===today), monthR=live.filter(r=>dkey(r.t)>=mStart);
  // same point last month
  const [y,m,d]=today.split('-').map(Number), lmEnd=new Date(Date.UTC(y,m-1,0)).getUTCDate();
  const lmStart=new Date(Date.UTC(y,m-2,1)).toISOString().slice(0,10), lmCut=lmStart.slice(0,8)+String(Math.min(d,lmEnd)).padStart(2,'0');
  const lastR=live.filter(r=>{const k=dkey(r.t);return k>=lmStart&&k<=lmCut});
  const sum=a=>a.reduce((s,r)=>s+r.b,0);
  const mB=sum(monthR), lB=sum(lastR);
  let delta=t('noLast');
  if(lB){const p=Math.round((mB-lB)/lB*100);delta=t('vsLast',{a:(p>0?'▲ ':p<0?'▼ ':'■ ')+Math.abs(p)+'%'})}
  // daily bars
  const days=d, per=new Array(days).fill(0); monthR.forEach(r=>{per[Number(dkey(r.t).slice(8,10))-1]+=r.b});
  const W=Math.min(448,innerWidth-64), H=120, max=Math.max(1,...per), bw=W/days;
  let svg=`<svg width="${W}" height="${H+16}" role="img" aria-label="${esc(t('dailyT'))}">`;
  per.forEach((v,i)=>{const h=Math.round(v/max*(H-6)), x=i*bw+1, w=Math.max(2,bw-2);
    if(v) svg+=`<rect class="mbar${i===days-1?' today':''}" x="${x}" y="${H-h}" width="${w}" height="${h}" rx="${Math.min(3,w/2)}"><title>${i+1}: ${v}</title></rect>`;
    if(i===0||(i+1)%5===0||i===days-1) svg+=`<text class="maxis" x="${x+w/2}" y="${H+12}" text-anchor="middle">${i+1}</text>`;});
  svg+=`<line x1="0" x2="${W}" y1="${H}" y2="${H}" stroke="#ddd"/></svg>`;
  const active=per.filter(v=>v>0).length, best=Math.max(0,...per), bestD=per.indexOf(best)+1;
  // entries: this month (+ last month while still reportable), newest first, with offline queue on top
  const showFrom = mine.earliestReport < mStart ? mine.earliestReport : mStart;
  const corrBy = {}; (mine.corrections||[]).forEach(c=>{ (corrBy[c.entryId]=corrBy[c.entryId]||[]).push(c); });
  const list = mine.rows.filter(r=>dkey(r.t)>=showFrom).sort((a,b)=>b.t-a.t);
  const queued = S.get('sh_queue',[]).filter(q=>q.username===session.username && !q._action);
  let html='', cur='';
  if(queued.length){ html+=`<div class="dayh"><span>⏳ ${esc(t('stQueued'))}</span></div>`;
    queued.forEach(q=>{ html+=`<div class="ent"><div class="tm">${hm(Date.parse(q.deviceTime))}</div><div class="bx"><b>${nf(q.boxes)}</b> ${esc(t('boxes'))}<div class="st"><span class="pill p-q">${esc(t('stQueued'))}</span></div></div></div>`; }); }
  list.forEach(r=>{
    const k=dkey(r.t);
    if(k!==cur){ cur=k; const tot=sum(list.filter(x=>dkey(x.t)===k&&!x.v));
      html+=`<div class="dayh"><span>${esc(k===today?t('today')+' · '+dayLabel(k):dayLabel(k))}</span><span>${nf(tot)} ${esc(t('boxes'))}</span></div>`; }
    const cs=(corrBy[r.id]||[]).sort((a,b)=>(a.requestedAt||0)-(b.requestedAt||0)), last=cs[cs.length-1];
    const pend=cs.find(c=>c.status==='Pending');
    let st='';
    if(r.v) st+=`<span class="pill p-void">${esc(t('stVoid'))}</span>`;
    if(r.am) st+=`<span class="pill p-am">${esc(t('stAm'))}</span>${esc(t('amFrom',{o:nf(r.ob),n:nf(r.b)}))}`;
    if(pend) st+=`<span class="pill p-pend">✏️ ${esc(t('stPend'))}</span>${esc(pend.type==='void'?t('pendVoid'):t('pendAmend',{n:nf(pend.newBoxes)}))}`;
    else if(last && last.status==='Rejected') st+=`<span class="pill p-rej">${esc(t('stRej'))}</span>${esc(t('rejBy',{r:last.reviewNote}))}`;
    const canReport = !r.v && !pend && k>=mine.earliestReport;
    const btn = pend && pend.requestedBy===session.username ? `<button class="rbtn" data-cancel="${esc(pend.id)}">${esc(t('cancelReq'))}</button>`
              : canReport ? `<button class="rbtn" data-rep="${esc(r.id)}">⚠️ ${esc(t('report'))}</button>` : '';
    html+=`<div class="ent${r.v?' void':''}"><div class="tm">${hm(r.t)}</div><div class="bx"><b>${nf(r.b)}</b> ${esc(t('boxes'))}${st?`<div class="st">${st}</div>`:''}</div>${btn}</div>`;
  });
  if(!list.length && !queued.length) html+=`<p class="sub" style="padding:10px 0">${esc(t('noEntries'))}</p>`;
  const pendN = (mine.corrections||[]).filter(c=>c.status==='Pending').length;
  $('mineBadge').textContent=pendN; $('mineBadge').classList.toggle('hidden',!pendN);
  $('mineBody').innerHTML=`
    <div class="tiles" style="margin-top:8px">
      <div class="tile"><div class="l">${esc(t('today'))}</div><div class="v">${nf(sum(todayR))}</div><div class="u">${esc(t('boxes'))}</div><div class="d">${esc(t('dropsN',{n:todayR.length}))}</div></div>
      <div class="tile"><div class="l">${esc(t('thisMonth'))}</div><div class="v">${nf(mB)}</div><div class="u">${esc(t('boxes'))}</div><div class="d">${esc(t('dropsN',{n:monthR.length}))}</div></div>
    </div>
    <div class="card" style="padding:12px 14px"><div class="d" style="font-size:13px;color:var(--muted);text-align:center">${esc(delta)}</div></div>
    <div class="card"><p class="ctitle">${esc(t('dailyT'))}</p><p class="csub">${esc(t('dailyS'))}</p>${svg}
      <div class="stats" style="margin-top:12px"><div><b>${active}</b><span>${esc(t('activeDays'))}</span></div>
      <div><b>${monthR.length?nf(mB/monthR.length):'–'}</b><span>${esc(t('avgDrop'))}</span></div>
      <div><b>${best?nf(best):'–'}</b><span>${esc(t('bestDay'))}${best?' ('+bestD+')':''}</span></div></div></div>
    <div class="card"><p class="ctitle">${esc(t('entriesT'))}</p><p class="csub">${esc(t('entriesS'))}</p>${html}</div>`;
  $('mUpd').textContent=t('updatedAt',{t:hm(mine.generated)});
  $('mineBody').querySelectorAll('[data-rep]').forEach(b=>b.onclick=()=>openReport(mine.rows.find(r=>r.id===b.dataset.rep)));
  $('mineBody').querySelectorAll('[data-cancel]').forEach(b=>b.onclick=async()=>{
    if(!confirm(t('confirmCancel'))) return;
    if(!navigator.onLine){ alert(t('repNeedNet')); return; }
    b.disabled=true; try{ await api({action:'cancel',token:session.token,requestId:b.dataset.cancel}); }catch(e){}
    loadMine();
  });
}

/* report a mistake */
function openReport(r){
  repEntry=r; $('repErr').textContent=''; $('repNote').value=''; $('repQty').value='';
  document.querySelectorAll('input[name=rk]').forEach(i=>i.checked=false);
  document.querySelectorAll('.opt').forEach(o=>o.classList.remove('on'));
  $('repQtyWrap').classList.add('hidden'); $('repSend').disabled=true;
  $('repEntry').textContent=dayLabel(dkey(r.t))+' · '+hm(r.t)+' · '+nf(r.b)+' '+t('boxes');
  $('repModal').style.display='flex';
}
function repValid(){
  const k=(document.querySelector('input[name=rk]:checked')||{}).value;
  if(!k) return false;
  if(k==='amend'){ const n=parseInt($('repQty').value,10); return n>=MIN_BOXES&&n<=MAX_BOXES&&n!==repEntry.b; }
  return true;
}
document.querySelectorAll('input[name=rk]').forEach(i=>i.onchange=()=>{
  document.querySelectorAll('.opt').forEach(o=>o.classList.toggle('on',o.dataset.k===i.value&&i.checked));
  $('repQtyWrap').classList.toggle('hidden',i.value!=='amend'); if(i.value==='amend') setTimeout(()=>$('repQty').focus(),50);
  $('repSend').disabled=!repValid();
});
$('repQty').addEventListener('input',e=>{e.target.value=e.target.value.replace(/\D/g,'').replace(/^0+/,'').slice(0,4);$('repSend').disabled=!repValid()});
$('repClose').onclick=()=>{$('repModal').style.display='none'};
$('repSend').onclick=async()=>{
  if(!repValid()) return;
  if(!navigator.onLine){ $('repErr').textContent=t('repNeedNet'); return; }
  const k=document.querySelector('input[name=rk]:checked').value;
  const body={action:'request',token:session.token,entryId:repEntry.id,note:$('repNote').value.trim(),
    type:k==='amend'?'amend':'void', reason:k==='amend'?'wrong_qty':k, newBoxes:k==='amend'?parseInt($('repQty').value,10):''};
  $('repSend').disabled=true;
  try{
    const r=await api(body);
    if(r.ok){ $('repModal').style.display='none'; alert(t('repOk')); loadMine(); return; }
    const map={pending_exists:'errPending',window_closed:'errWindow',no_change:'errNoChange',already_void:'errVoid',boxes:'errBoxes',auth:'expired'};
    $('repErr').textContent=t(map[r.error]||'errServer');
  }catch(e){ $('repErr').textContent=t('repNeedNet'); }
  $('repSend').disabled=!repValid();
};

/* ---------- utils ---------- */
function uid(){return (crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2))}
function fmtTime(d){return d.toLocaleString(lang==='vi'?'vi-VN':'en-GB',{timeZone:'Asia/Ho_Chi_Minh',day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit'})}

/* ---------- boot ---------- */
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
$('uName').value=S.get('sh_lastUser','');
applyLang();
if(sessionValid()){show('vEntry');flushQueue()} else {session=null;S.del('sh_session');renderHeader();show('vLogin')}
</script>
