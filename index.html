<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1A4FA0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SalesData">
<title>SalesData</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<style>
  :root{
    --brand:#1A4FA0; --brand-dark:#123A78; --accent:#F5C84C; --ink:#1A1A1A; --muted:#6B6B6B;
    --bg:#F4F2EF; --card:#FFFFFF; --line:#E3DFDA;
    --green:#1E9E4A; --orange:#E07B00; --red:#D0212B;
    --radius:16px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
       background:var(--bg);color:var(--ink);font-size:17px;line-height:1.4}
  .wrap{max-width:480px;margin:0 auto;padding:0 16px calc(24px + env(safe-area-inset-bottom))}
  header{background:var(--brand);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 14px}
  .hdr{max-width:480px;margin:0 auto;display:flex;align-items:center;gap:12px}
  .logo{height:58px;width:auto;max-width:90px;object-fit:contain;background:#fff;border-radius:12px;padding:3px 5px}
  .hero{display:block;width:72%;max-width:260px;margin:2px auto 10px}
  .logo-fallback{display:none;font-weight:900;letter-spacing:.5px;line-height:1;font-size:14px;
       background:#fff;color:var(--brand);border-radius:10px;padding:7px 9px;text-align:center}
  .who{flex:1;min-width:0}
  .who .name{font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .who .user{font-size:13px;opacity:.85}
  .hbtns{display:flex;gap:6px}
  .chip{border:1px solid rgba(255,255,255,.6);background:transparent;color:#fff;border-radius:999px;
        padding:6px 10px;font-size:13px;font-weight:600}
  .card{background:var(--card);border-radius:var(--radius);padding:18px;margin-top:14px;border:1px solid var(--line)}
  h1{font-size:22px;margin:4px 0 2px}
  .sub{color:var(--muted);font-size:14px;margin:0}
  label{display:block;font-weight:700;margin:14px 0 6px}
  input{width:100%;font-size:22px;padding:14px;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
  input:focus{outline:none;border-color:var(--brand)}
  input.big{font-size:40px;font-weight:800;text-align:center;letter-spacing:1px}
  input.pin{letter-spacing:12px;text-align:center;font-weight:800}
  .hint{font-size:13px;color:var(--muted);margin-top:6px}
  .err{color:var(--red);font-size:14px;font-weight:600;margin-top:8px;min-height:1em}
  .btn{display:block;width:100%;border:0;border-radius:14px;padding:17px;font-size:19px;font-weight:800;
       background:var(--brand);color:#fff;margin-top:16px}
  .btn:active{background:var(--brand-dark)}
  .btn:disabled{background:#C9C4BE;color:#fff}
  .btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--line)}
  .btn.green{background:var(--green)}
  .row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
  .row:last-child{border-bottom:0}
  .row .k{color:var(--muted)} .row .v{font-weight:700;text-align:right;word-break:break-word}
  /* GPS */
  .gps{display:flex;gap:12px;align-items:center}
  .dot{width:22px;height:22px;border-radius:50%;flex:none;background:#BBB;box-shadow:0 0 0 5px rgba(0,0,0,.06)}
  .dot.green{background:var(--green);box-shadow:0 0 0 5px rgba(30,158,74,.18)}
  .dot.orange{background:var(--orange);box-shadow:0 0 0 5px rgba(224,123,0,.18)}
  .dot.red{background:var(--red);box-shadow:0 0 0 5px rgba(208,33,43,.18)}
  .dot.wait{animation:pulse 1.2s infinite}
  @keyframes pulse{50%{opacity:.35}}
  .gps .t{font-weight:800}
  .gps .d{font-size:13px;color:var(--muted)}
  .legend{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;font-size:13px;margin-top:12px;
          padding-top:12px;border-top:1px dashed var(--line);align-items:center}
  .legend i{display:inline-block;width:12px;height:12px;border-radius:50%}
  .big-num{font-size:46px;font-weight:900;text-align:center;color:var(--brand);margin:6px 0}
  .center{text-align:center}
  .tick{width:84px;height:84px;border-radius:50%;background:var(--green);color:#fff;font-size:50px;
        display:flex;align-items:center;justify-content:center;margin:10px auto}
  .tick.amber{background:var(--orange)}
  .banner{background:#FFF4E0;border:1px solid #F3C98A;color:#7A4A00;border-radius:12px;padding:10px 12px;
          font-size:14px;margin-top:14px;display:none}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center;z-index:9}
  .modal .box{background:#fff;width:100%;max-width:480px;border-radius:20px 20px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom))}
  .hidden{display:none!important}
  .tagline{background:#0F2F63;color:#F5C84C;text-align:center;font-size:clamp(10.5px,2.9vw,13px);font-weight:700;
           padding:7px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mission{position:fixed;inset:0;z-index:10;background:linear-gradient(170deg,#1A4FA0 0%,#0F2F63 100%);
           color:#fff;display:none;flex-direction:column;overflow-y:auto;
           padding:calc(28px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom))}
  .mission .in{max-width:440px;margin:auto;width:100%;text-align:center}
  .mission img{width:62%;max-width:230px;background:#fff;border-radius:20px;padding:10px 12px;margin-bottom:22px}
  .mission .hello{font-size:18px;opacity:.9;margin-bottom:14px}
  .mission .msg{font-size:24px;line-height:1.45;font-weight:700;text-align:left}
  .mission .msg b{color:#FFE7A3}
  .mission .ok{background:#fff;color:var(--brand);margin-top:30px;font-size:22px}
  .tabs{display:flex;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
  .tabs button{flex:1;border:0;background:transparent;padding:12px 6px;font-size:15.5px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent}
  .tabs button.on{color:var(--brand);border-bottom-color:var(--brand)}
  .tabs .badge{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--orange);color:#fff;font-size:11.5px;margin-left:4px;vertical-align:2px}
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
  .tile .l{font-size:13px;color:var(--muted);font-weight:600}
  .tile .v{font-size:34px;font-weight:900;color:var(--ink);line-height:1.1;margin-top:4px}
  .tile .u{font-size:13px;color:var(--muted)}
  .tile .d{font-size:12.5px;color:var(--muted);margin-top:4px}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;gap:6px}
  .stats b{display:block;font-size:20px} .stats span{font-size:12px;color:var(--muted)}
  .ctitle{font-weight:800;font-size:16px;margin:0 0 2px} .csub{font-size:12.5px;color:var(--muted);margin:0 0 10px}
  .mbar{fill:var(--brand)} .mbar.today{fill:var(--accent)} .maxis{fill:var(--muted);font-size:10px}
  .dayh{font-size:13px;font-weight:800;color:var(--muted);margin:14px 0 4px;display:flex;justify-content:space-between}
  .ent{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
  .ent:last-child{border-bottom:0}
  .ent .tm{font-weight:700;width:48px;flex:none;font-size:15px}
  .ent .bx{flex:1;min-width:0}
  .ent .bx b{font-size:18px}
  .ent .st{font-size:12.5px;color:var(--muted);margin-top:2px}
  .ent.void .bx b{text-decoration:line-through;color:var(--muted)}
  .pill{display:inline-block;font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 8px;margin-right:4px}
  .p-pend{background:#FFF1DB;color:#8A4B00} .p-am{background:#E3EDFB;color:#123A78} .p-void{background:#EEE;color:#555}
  .p-rej{background:#FCE4E4;color:#8F1C1C} .p-q{background:#FFF1DB;color:#8A4B00}
  .rbtn{flex:none;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;font-size:13px;font-weight:700;color:var(--ink)}
  .opt{display:flex;gap:10px;align-items:center;border:2px solid var(--line);border-radius:12px;padding:12px;margin-top:8px;font-weight:700}
  .opt.on{border-color:var(--brand);background:#F1F6FD}
  .opt input{width:auto;margin:0}
  textarea{width:100%;font:inherit;font-size:16px;padding:10px;border:2px solid var(--line);border-radius:12px;min-height:70px}
  .refresh{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--muted);margin-top:12px}
  .refresh button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px 12px;font-weight:700}
  .foot{font-size:12px;color:var(--muted);text-align:center;margin-top:18px}
</style>
</head>
<body>

<header>
  <div class="hdr">
    <img class="logo" src="logo.png" alt="Super Horse" onerror="this.style.display='none';document.getElementById('logoFb').style.display='block'">
    <div class="logo-fallback" id="logoFb">SUPER<br>HORSE</div>
    <div class="who">
      <div class="name" id="hName">SalesData</div>
      <div class="user" id="hUser" data-i="appTitle"></div>
    </div>
    <div class="hbtns">
      <button class="chip" id="langBtn">EN</button>
      <button class="chip hidden" id="logoutBtn" data-i="logout"></button>
    </div>
  </div>
</header>
<div class="tagline hidden" id="tagline" data-i="tagline"></div>
<nav class="tabs hidden" id="tabs">
  <button id="tabEntry" class="on" data-i="tabEntry"></button>
  <button id="tabMine"><span data-i="tabMine"></span><span class="badge hidden" id="mineBadge"></span></button>
</nav>

<div class="wrap">

  <!-- LOGIN -->
  <section id="vLogin" class="hidden">
    <div class="card">
      <img class="hero" src="logo.png" alt="Super Horse Classic &amp; Pink" onerror="this.remove()">
      <h1 data-i="loginTitle"></h1>
      <p class="sub" data-i="loginSub"></p>
      <label for="uName" data-i="username"></label>
      <input id="uName" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false">
      <label for="uPin" data-i="pin"></label>
      <input id="uPin" class="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="current-password">
      <div class="err" id="loginErr"></div>
      <button class="btn" id="loginBtn" data-i="loginBtn"></button>
    </div>
  </section>

  <!-- ENTRY -->
  <section id="vEntry" class="hidden">
    <div class="banner" id="queueBanner"></div>

    <div class="card">
      <div class="gps">
        <div class="dot wait" id="gDot"></div>
        <div>
          <div class="t" id="gTitle"></div>
          <div class="d" id="gDesc"></div>
        </div>
      </div>
      <div class="legend">
        <i style="background:var(--green)"></i><span data-i="lgGreen"></span>
        <i style="background:var(--orange)"></i><span data-i="lgOrange"></span>
        <i style="background:var(--red)"></i><span data-i="lgRed"></span>
      </div>
      <p class="hint" data-i="gpsWhy"></p>
    </div>

    <div class="card">
      <label for="boxes" style="margin-top:0" data-i="boxesLabel"></label>
      <input id="boxes" class="big" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" placeholder="0">
      <div class="hint" data-i="boxesHint"></div>
      <div class="err" id="boxErr"></div>
      <button class="btn" id="confirmBtn" disabled data-i="confirm"></button>
      <div class="err center" id="confirmWhy" style="color:var(--muted);font-weight:500"></div>
    </div>
  </section>

  <!-- REVIEW -->
  <section id="vReview" class="hidden">
    <div class="card">
      <h1 data-i="reviewTitle"></h1>
      <p class="sub" data-i="reviewSub"></p>
      <div class="big-num" id="rBoxes"></div>
      <div class="center sub" data-i="boxesUnit"></div>
      <div style="margin-top:14px">
        <div class="row"><span class="k" data-i="rEmployee"></span><span class="v" id="rEmp"></span></div>
        <div class="row"><span class="k" data-i="rTime"></span><span class="v" id="rTime"></span></div>
        <div class="row"><span class="k" data-i="rGps"></span><span class="v" id="rGps"></span></div>
        <div class="row"><span class="k" data-i="rAcc"></span><span class="v" id="rAcc"></span></div>
      </div>
      <button class="btn green" id="submitBtn" data-i="submit"></button>
      <button class="btn ghost" id="backBtn" data-i="back"></button>
    </div>
  </section>

  <!-- DONE -->
  <section id="vDone" class="hidden">
    <div class="card center">
      <div class="tick" id="dTick">✓</div>
      <h1 id="dTitle"></h1>
      <p class="sub" id="dSub"></p>
      <div class="big-num" id="dBoxes"></div>
      <button class="btn" id="newBtn" data-i="newEntry"></button>
    </div>
  </section>

  <!-- MY SALES (read-only) -->
  <section id="vMine" class="hidden">
    <div class="refresh"><span id="mUpd"></span><button id="mRefresh" data-i="refresh"></button></div>
    <div class="err" id="mErr"></div>
    <div id="mineBody"></div>
  </section>

  <div class="foot">SalesData · v3.0.1</div>
</div>

<!-- Welcome / mission screen (once per login) -->
<div class="mission" id="mission">
  <div class="in">
    <img src="logo.png" alt="Super Horse" onerror="this.remove()">
    <div class="hello" id="mHello"></div>
    <div class="msg" id="mMsg"></div>
    <button class="btn ok" id="mOk">OK</button>
  </div>
</div>

<!-- Report a mistake -->
<div class="modal" id="repModal">
  <div class="box" style="max-height:92vh;overflow:auto">
    <h1 data-i="repTitle"></h1>
    <p class="sub" id="repEntry"></p>
    <label class="opt" data-k="amend"><input type="radio" name="rk" value="amend"><span data-i="optQty"></span></label>
    <div id="repQtyWrap" class="hidden">
      <label for="repQty" data-i="newQty"></label>
      <input id="repQty" class="big" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="0">
    </div>
    <label class="opt" data-k="duplicate"><input type="radio" name="rk" value="duplicate"><span data-i="optDup"></span></label>
    <label class="opt" data-k="not_mine"><input type="radio" name="rk" value="not_mine"><span data-i="optNotMine"></span></label>
    <label for="repNote" data-i="repNote"></label>
    <textarea id="repNote" maxlength="300"></textarea>
    <p class="hint" data-i="repHow"></p>
    <div class="err" id="repErr"></div>
    <button class="btn" id="repSend" data-i="repSend" disabled></button>
    <button class="btn ghost" id="repClose" data-i="cancel"></button>
  </div>
</div>

<!-- Large-quantity double check -->
<div class="modal" id="bigModal">
  <div class="box center">
    <h1 data-i="bigTitle"></h1>
    <div class="big-num" id="bigNum"></div>
    <p class="sub" data-i="bigSub"></p>
    <button class="btn green" id="bigYes" data-i="bigYes"></button>
    <button class="btn ghost" id="bigNo" data-i="bigNo"></button>
  </div>
</div>

<script>
/* ================== CONFIG ================== */
const API_URL = 'https://script.google.com/macros/s/AKfycbwx9JWqWJlHNZlQ2IWpJFFvySi3-HYgj1av-EY830c0ryAxt7UlTzAwJwNkxhgjPYYx/exec';
const MIN_BOXES = 1, MAX_BOXES = 2400, BIG_QTY = 500;
const GREEN_M = 20, ORANGE_M = 50;      // accuracy bands (metres)

    pendAmend:'Yêu cầu sửa thành {n} thùng', pendVoid:'Yêu cầu hủy mục này', amFrom:'gốc {o} → {n} thùng', rejBy:'Lý do: {r}',

/* ---------- GPS (runs only while entry screen is open & visible) ---------- */
function startGps(){
  if(gps.watch!==null) return;
  if(!('geolocation' in navigator)){gps.status='none';renderGps();return}
  gps.best=null; gps.start=Date.now(); gps.status='wait';
  gps.watch=navigator.geolocation.watchPosition(onPos,onPosErr,{enableHighAccuracy:true,maximumAge:0,timeout:30000});
  clearInterval(gps.timer); gps.timer=setInterval(()=>{renderGps();updateConfirm()},1000);
  renderGps();
}
function stopGps(){
  if(gps.watch!==null){navigator.geolocation.clearWatch(gps.watch);gps.watch=null}
  clearInterval(gps.timer); gps.timer=null;
}
function onPos(p){
  const c=p.coords, fix={lat:c.latitude,lng:c.longitude,acc:Math.round(c.accuracy),at:Date.now()};
  // keep the most accurate recent fix (fresh within 30 s)
  if(!gps.best || fix.acc<=gps.best.acc || Date.now()-gps.best.at>30000) gps.best=fix;
  renderGps(); updateConfirm();
}
function onPosErr(e){
  if(e.code===1){gps.status='denied';renderGps();updateConfirm()}
}
function band(acc){return acc<=GREEN_M?'green':acc<=ORANGE_M?'orange':'red'}
function renderGps(){
  const dot=$('gDot'), ti=$('gTitle'), de=$('gDesc');
  dot.className='dot';
  if(gps.status==='denied'){dot.classList.add('red');ti.textContent=t('gpsRed');de.textContent=t('gpsDenied');return}
  if(gps.status==='none'){dot.classList.add('red');ti.textContent=t('gpsRed');de.textContent=t('gpsNone');return}
  if(!gps.best){dot.classList.add('wait');ti.textContent=t('gpsWait');de.textContent='';return}
  const b=band(gps.best.acc);
  dot.classList.add(b);
  ti.textContent=t(b==='green'?'gpsGreen':b==='orange'?'gpsOrange':'gpsRed');
  de.textContent=t('gpsAcc',{m:gps.best.acc})+' · '+gps.best.lat.toFixed(6)+', '+gps.best.lng.toFixed(6);
}
function gpsOk(){
  if(!gps.best) return {ok:false,why:t('whyGps')};
  const b=band(gps.best.acc);
  if(b==='green') return {ok:true};
  if(b==='red') return {ok:false,why:t('whyRed')};
  const left=ORANGE_AFTER_S-Math.floor((Date.now()-gps.start)/1000);
  return left<=0?{ok:true}:{ok:false,why:t('whyOrange',{s:left})};
}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden) stopGps();
  else if(!$('vEntry').classList.contains('hidden')) startGps();
});

/* ---------- offline queue ---------- */
let flushing=false;
async function flushQueue(){
  if(flushing||!navigator.onLine) return;
  let q=S.get('sh_queue',[]); if(!q.length) return;
  flushing=true;
  const keep=[];
  for(const rec of q){
    try{
      const res=await api({action:'submit',...rec});
      if(!res.ok) keep.push(rec);   // keep on any failure; server ignores duplicates by id
    }catch(e){keep.push(rec)}
  }
  S.set('sh_queue',keep); flushing=false; renderQueue();
}
function renderQueue(){
  const n=S.get('sh_queue',[]).length, el=$('queueBanner');
  el.style.display=n?'block':'none'; el.textContent=t('queueN',{n});
}

function renderMine(){

  // same point last month
  const [y,m,d]=today.split('-').map(Number), lmEnd=new Date(Date.UTC(y,m-1,0)).getUTCDate();
  const lmStart=new Date(Date.UTC(y,m-2,1)).toISOString().slice(0,10), lmCut=lmStart.slice(0,8)+String(Math.min(d,lmEnd)).padStart(2,'0');
  const lastR=live.filter(r=>{const k=dkey(r.t);return k>=lmStart&&k<=lmCut});

  const days=d, per=new Array(days).fill(0); monthR.forEach(r=>{per[Number(dkey(r.t).slice(8,10))-1]+=r.b});

  const active=per.filter(v=>v>0).length, best=Math.max(0,...per), bestD=per.indexOf(best)+1;
  // entries: this month (+ last month while still reportable), newest first, with offline queue on top
  const showFrom = mine.earliestReport < mStart ? mine.earliestReport : mStart;
  const corrBy = {}; (mine.corrections||[]).forEach(c=>{ (corrBy[c.entryId]=corrBy[c.entryId]||[]).push(c); });
  const list = mine.rows.filter(r=>dkey(r.t)>=showFrom).sort((a,b)=>b.t-a.t);

  list.forEach(r=>{

      html+=`<div class="dayh"><span>${esc(k===today?t('today')+' · '+dayLabel(k):dayLabel(k))}</span><span>${nf(tot)} ${esc(t('boxes'))}</span></div>`; }
    const cs=(corrBy[r.id]||[]).sort((a,b)=>(a.requestedAt||0)-(b.requestedAt||0)), last=cs[cs.length-1];
    const pend=cs.find(c=>c.status==='Pending');
    let st='';
    if(r.v) st+=`<span class="pill p-void">${esc(t('stVoid'))}</span>`;
    if(r.am) st+=`<span class="pill p-am">${esc(t('stAm'))}</span>${esc(t('amFrom',{o:nf(r.ob),n:nf(r.b)}))}`;
    if(pend) st+=`<span class="pill p-pend">✏️ ${esc(t('stPend'))}</span>${esc(pend.type==='void'?t('pendVoid'):t('pendAmend',{n:nf(pend.newBoxes)}))}`;
    else if(last && last.status==='Rejected') st+=`<span class="pill p-rej">${esc(t('stRej'))}</span>${esc(t('rejBy',{r:last.reviewNote}))}`;
    const canReport = !r.v && !pend && k>=mine.earliestReport;

  if(!list.length && !queued.length) html+=`<p class="sub" style="padding:10px 0">${esc(t('noEntries'))}</p>`;
  const pendN = (mine.corrections||[]).filter(c=>c.status==='Pending').length;
  $('mineBadge').textContent=pendN; $('mineBadge').classList.toggle('hidden',!pendN);
  $('mineBody').innerHTML=`
    <div class="tiles" style="margin-top:8px">
      <div class="tile"><div class="l">${esc(t('today'))}</div><div class="v">${nf(sum(todayR))}</div><div class="u">${esc(t('boxes'))}</div><div class="d">${esc(t('dropsN',{n:todayR.length}))}</div></div>
      <div class="tile"><div class="l">${esc(t('thisMonth'))}</div><div class="v">${nf(mB)}</div><div class="u">${esc(t('boxes'))}</div><div class="d">${esc(t('dropsN',{n:monthR.length}))}</div></div>
    </div>
    <div class="card" style="padding:12px 14px"><div class="d" style="font-size:13px;color:var(--muted);text-align:center">${esc(delta)}</div></div>
    <div class="card"><p class="ctitle">${esc(t('dailyT'))}</p><p class="csub">${esc(t('dailyS'))}</p>${svg}
      <div class="stats" style="margin-top:12px"><div><b>${active}</b><span>${esc(t('activeDays'))}</span></div>
      <div><b>${monthR.length?nf(mB/monthR.length):'–'}</b><span>${esc(t('avgDrop'))}</span></div>
      <div><b>${best?nf(best):'–'}</b><span>${esc(t('bestDay'))}${best?' ('+bestD+')':''}</span></div></div></div>
    <div class="card"><p class="ctitle">${esc(t('entriesT'))}</p><p class="csub">${esc(t('entriesS'))}</p>${html}</div>`;
  $('mUpd').textContent=t('updatedAt',{t:hm(mine.generated)});
  $('mineBody').querySelectorAll('[data-rep]').forEach(b=>b.onclick=()=>openReport(mine.rows.find(r=>r.id===b.dataset.rep)));
  $('mineBody').querySelectorAll('[data-cancel]').forEach(b=>b.onclick=async()=>{
    if(!confirm(t('confirmCancel'))) return;
    if(!navigator.onLine){ alert(t('repNeedNet')); return; }
    b.disabled=true; try{ await api({action:'cancel',token:session.token,requestId:b.dataset.cancel}); }catch(e){}
    loadMine();
  });
}

/* report a mistake */
function openReport(r){
  repEntry=r; $('repErr').textContent=''; $('repNote').value=''; $('repQty').value='';
  document.querySelectorAll('input[name=rk]').forEach(i=>i.checked=false);
  document.querySelectorAll('.opt').forEach(o=>o.classList.remove('on'));
  $('repQtyWrap').classList.add('hidden'); $('repSend').disabled=true;
  $('repEntry').textContent=dayLabel(dkey(r.t))+' · '+hm(r.t)+' · '+nf(r.b)+' '+t('boxes');
  $('repModal').style.display='flex';
}
function repValid(){
  const k=(document.querySelector('input[name=rk]:checked')||{}).value;
  if(!k) return false;
  if(k==='amend'){ const n=parseInt($('repQty').value,10); return n>=MIN_BOXES&&n<=MAX_BOXES&&n!==repEntry.b; }
  return true;
}
document.querySelectorAll('input[name=rk]').forEach(i=>i.onchange=()=>{
  document.querySelectorAll('.opt').forEach(o=>o.classList.toggle('on',o.dataset.k===i.value&&i.checked));
  $('repQtyWrap').classList.toggle('hidden',i.value!=='amend'); if(i.value==='amend') setTimeout(()=>$('repQty').focus(),50);
  $('repSend').disabled=!repValid();
});
$('repQty').addEventListener('input',e=>{e.target.value=e.target.value.replace(/\D/g,'').replace(/^0+/,'').slice(0,4);$('repSend').disabled=!repValid()});
$('repClose').onclick=()=>{$('repModal').style.display='none'};
$('repSend').onclick=async()=>{
  if(!repValid()) return;
  if(!navigator.onLine){ $('repErr').textContent=t('repNeedNet'); return; }
  const k=document.querySelector('input[name=rk]:checked').value;
  const body={action:'request',token:session.token,entryId:repEntry.id,note:$('repNote').value.trim(),
    type:k==='amend'?'amend':'void', reason:k==='amend'?'wrong_qty':k, newBoxes:k==='amend'?parseInt($('repQty').value,10):''};
  $('repSend').disabled=true;
  try{
    const r=await api(body);
    if(r.ok){ $('repModal').style.display='none'; alert(t('repOk')); loadMine(); return; }
    const map={pending_exists:'errPending',window_closed:'errWindow',no_change:'errNoChange',already_void:'errVoid',boxes:'errBoxes',auth:'expired'};
    $('repErr').textContent=t(map[r.error]||'errServer');
  }catch(e){ $('repErr').textContent=t('repNeedNet'); }
  $('repSend').disabled=!repValid();
};

/* ---------- utils ---------- */
function uid(){return (crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2))}
function fmtTime(d){return d.toLocaleString(lang==='vi'?'vi-VN':'en-GB',{timeZone:'Asia/Ho_Chi_Minh',day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit'})}

/* ---------- boot ---------- */
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
$('uName').value=S.get('sh_lastUser','');
applyLang();
if(sessionValid()){show('vEntry');flushQueue()} else {session=null;S.del('sh_session');renderHeader();show('vLogin')}
</script>
</body>
</html>
