<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1A4FA0">
<title>SalesData Manager</title>
<link rel="icon" href="icon.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root{
    --brand:#1A4FA0; --brand-dark:#0F2F63; --gold:#F5C84C;
    --bg:#F2F3F5; --surface:#FFFFFF; --surface-2:#F0EFEC; --line:#E2E1DC;
    --ink:#0B0B0B; --ink-2:#52514E; --muted:#7A7975;
    --good:#1E9E4A; --warn:#B86E00; --bad:#C62828; --radius:14px;
  }
  @media (prefers-color-scheme: dark){
    :root:where(:not([data-theme="light"])){
      --bg:#111; --surface:#1A1A19; --surface-2:#262624; --line:#33332F; --ink:#F0EFEC; --ink-2:#C3C2B7; --muted:#9A998F;
      --good:#3CB371; --warn:#F0A030; --bad:#EF6B6B;
    }
  }
  :root[data-theme="dark"]{ --bg:#111; --surface:#1A1A19; --surface-2:#262624; --line:#33332F; --ink:#F0EFEC; --ink-2:#C3C2B7; --muted:#9A998F; --good:#3CB371; --warn:#F0A030; --bad:#EF6B6B; }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.4;font-variant-numeric:tabular-nums}
  button,select,input,textarea{font:inherit;color:inherit}
  .hidden{display:none!important}
  header{background:var(--brand);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px}
  .hdr{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:12px}
  .hdr img{height:44px;background:#fff;border-radius:10px;padding:2px 4px}
  .hdr .ttl{flex:1;min-width:0} .hdr .ttl b{display:block;font-size:17px} .hdr .ttl span{font-size:12.5px;opacity:.85}
  .chip{border:1px solid rgba(255,255,255,.6);background:transparent;color:#fff;border-radius:999px;padding:6px 11px;font-size:13px;font-weight:600;cursor:pointer}
  .tagline{background:var(--brand-dark);color:var(--gold);text-align:center;font-size:12.5px;font-weight:700;padding:6px 10px}
  .wrap{max-width:1100px;margin:0 auto;padding:0 16px 40px}
  .tabs{display:flex;gap:4px;margin-top:14px;border-bottom:1px solid var(--line);overflow-x:auto}
  .tabs button{border:0;background:transparent;padding:10px 14px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
  .tabs button.on{color:var(--brand);border-bottom-color:var(--brand)}
  .cnt{display:inline-block;min-width:20px;padding:0 6px;border-radius:10px;background:var(--warn);color:#fff;font-size:12px;margin-left:4px}
  .bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:14px 0}
  .bar select,.bar input{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-height:38px}
  .upd{font-size:12.5px;color:var(--muted);margin-left:auto}
  .btn{background:var(--brand);color:#fff;border:0;border-radius:10px;padding:9px 14px;min-height:38px;font-weight:700;cursor:pointer}
  .btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
  .btn.good{background:var(--good)} .btn.bad{background:var(--bad)}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-top:12px}
  .card.large{border-left:5px solid var(--warn)}
  .rq-h{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
  .rq-id{font-weight:800}
  .pill{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;border:1px solid var(--line);margin-right:4px}
  .pill.warn{background:#FFF1DB;color:#8A4B00;border-color:#F3C98A}
  .pill.good{background:#E3F4E8;color:#1B5E20;border-color:#B5DDC0}
  .pill.bad{background:#FCE4E4;color:#8F1C1C;border-color:#F0B9B9}
  .pill.info{background:#E3EDFB;color:#123A78;border-color:#B9CFF0}
  .pill.mute{background:var(--surface-2);color:var(--ink-2)}
  .change{font-size:26px;font-weight:900;margin:10px 0 4px}
  .change .arrow{color:var(--muted);margin:0 8px}
  .change s{color:var(--muted)}
  .kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;font-size:14px;margin-top:8px}
  .kv span:nth-child(odd){color:var(--muted)}
  .note{background:var(--surface-2);border-radius:10px;padding:8px 10px;margin-top:8px;font-size:14px}
  textarea{width:100%;min-height:60px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--surface);margin-top:10px}
  .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .own{color:var(--warn);font-weight:700;font-size:13.5px;margin-top:8px}
  .ctx{margin-top:10px;font-size:13.5px}
  .ctx table{width:100%;border-collapse:collapse}
  .ctx td{padding:5px 6px;border-bottom:1px solid var(--line)}
  .ctx tr.me td{background:#FFF7E3;font-weight:700}
  table.t{width:100%;border-collapse:collapse;font-size:14px}
  table.t th{text-align:left;font-size:12px;color:var(--ink-2);font-weight:600;padding:8px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface);position:sticky;top:0}
  table.t td{padding:8px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:top}
  table.t td.num,table.t th.num{text-align:right}
  tr.void td{color:var(--muted)} tr.void td b{text-decoration:line-through}
  .box{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:auto;max-height:70vh}
  .empty{color:var(--muted);text-align:center;padding:28px 0}
  a{color:var(--brand)}
  .login{max-width:380px;margin:40px auto;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px}
  .login h1{font-size:20px;margin:0 0 4px}
  .login label{display:block;font-weight:700;margin:14px 0 6px;font-size:14px}
  .login input{width:100%;font-size:18px;padding:12px;border:2px solid var(--line);border-radius:12px;background:var(--surface)}
  .login .btn{width:100%;margin-top:16px;padding:14px;font-size:17px}
  .err{color:var(--bad);font-weight:600;font-size:14px;margin-top:8px;min-height:1em}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:30;padding:16px}
  .modal .in{background:var(--surface);border-radius:16px;padding:20px;width:100%;max-width:480px;max-height:90vh;overflow:auto}
  .modal h2{margin:0 0 4px;font-size:19px}
  .opt{display:flex;gap:10px;align-items:center;border:2px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:8px;font-weight:700;cursor:pointer}
  .opt.on{border-color:var(--brand)}
  .modal input[type=text]{width:100%;font-size:22px;font-weight:800;text-align:center;padding:10px;border:2px solid var(--line);border-radius:12px;background:var(--surface);margin-top:8px}
  .hist{font-size:13px;margin-top:10px}
  .hist div{padding:4px 0;border-bottom:1px dashed var(--line)}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1F1F1F;color:#fff;border-radius:12px;padding:10px 16px;font-weight:700;z-index:40;display:none}
  .kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
  @media(min-width:760px){.kpis{grid-template-columns:repeat(6,1fr)}}
  .kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
  .kpi .l{font-size:12px;color:var(--ink-2)} .kpi .v{font-size:24px;font-weight:800}
  table.t tr.click{cursor:pointer} table.t tr.click:hover td{background:var(--surface-2)}
  .neg{color:var(--bad);font-weight:800}
  .fl{display:inline-block;font-size:11.5px;font-weight:700;border-radius:999px;padding:1px 7px;margin:1px 2px 1px 0;white-space:nowrap}
  .fl.bad{background:#FCE4E4;color:#8F1C1C} .fl.warn{background:#FFF1DB;color:#8A4B00} .fl.info{background:#E3EDFB;color:#123A78} .fl.mute{background:var(--surface-2);color:var(--ink-2)}
  .dhead{display:grid;grid-template-columns:1fr;gap:12px}
  @media(min-width:860px){.dhead{grid-template-columns:2fr 1fr 1fr}}
  .bal{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
  .bal .l{font-size:12.5px;color:var(--ink-2)} .bal .v{font-size:30px;font-weight:900} .bal .s{font-size:12.5px;color:var(--muted)}
  .emp{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:4px 10px;margin:3px 4px 0 0;font-size:13px;font-weight:700;cursor:pointer;background:var(--surface)}
  .emp.on{border-color:var(--brand);color:var(--brand);background:#F1F6FD}
  .legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12.5px;color:var(--ink-2);margin-top:8px}
  .legend i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:4px;vertical-align:-1px}
  .sec{margin-top:14px} .sec h3{font-size:15.5px;margin:0 0 6px}
  .two{display:grid;grid-template-columns:1fr;gap:12px} @media(min-width:980px){.two{grid-template-columns:1fr 1fr}}
  tr.sub td{background:var(--surface-2);font-weight:800}
  .cmpl{display:grid;grid-template-columns:repeat(3,auto);gap:2px 16px;font-size:14px;margin-top:8px;justify-content:start}
  .cmpl b{font-size:18px}
</style>
</head>
<body>
<header>
  <div class="hdr">
    <img src="logo.png" alt="Super Horse" onerror="this.remove()">
    <div class="ttl"><b>SalesData · <span data-i="title" style="font-size:inherit;opacity:1"></span></b><span id="who"></span></div>
    <a class="chip" id="helpBtn" href="guide-manager.html?from=app" title="Help / Hướng dẫn" aria-label="Help" style="text-decoration:none;font-weight:800;min-width:34px;text-align:center">?</a>
      <a class="chip" href="portal.html" title="SalesData home / Trang chủ" aria-label="Home" style="text-decoration:none;font-weight:800">⌂</a>
      <button class="chip" id="langBtn">EN</button>
    <button class="chip hidden" id="logoutBtn" data-i="logout"></button>
  </div>
</header>
<div class="tagline" data-i="tagline"></div>

<div class="wrap">
  <div class="login hidden" id="vLogin">
    <h1 data-i="loginTitle"></h1>
    <p style="margin:0;font-size:13.5px;color:var(--muted)" data-i="loginSub"></p>
    <label for="uName" data-i="username"></label>
    <input id="uName" autocomplete="username" autocapitalize="none" spellcheck="false">
    <label for="uPin" data-i="pin"></label>
    <input id="uPin" type="password" inputmode="numeric" maxlength="4" autocomplete="current-password" style="letter-spacing:10px;text-align:center;font-weight:800">
    <div class="err" id="loginErr"></div>
    <button class="btn" id="loginBtn" data-i="loginBtn"></button>
  </div>

  <div id="vApp" class="hidden">
    <div class="tabs">
      <button data-tab="overview" class="on" data-i="tOverview"></button>
      <button data-tab="stockq"><span data-i="tStockQ"></span><span class="cnt hidden" id="sqCnt"></span></button>
      <button data-tab="close" data-i="tClose"></button>
      <button data-tab="sales" data-i="tSales"></button>
      <button data-tab="queue"><span data-i="tQueue"></span><span class="cnt hidden" id="qCnt"></span></button>
      <button data-tab="search" data-i="tSearch"></button>
      <button data-tab="history" data-i="tHistory"></button>
    </div>

    <section id="pOverview">
      <div class="bar"><input type="month" id="oMonth" aria-label="Month"><button class="btn ghost" id="oRefresh" data-i="refresh"></button><span class="upd" id="oUpd"></span></div>
      <div class="kpis" id="oKpis"></div>
      <p style="font-size:13px;color:var(--muted);margin:0 0 8px" data-i="oHint"></p>
      <div class="box" id="oTable"></div>
    </section>

    <section id="pDetail" class="hidden">
      <div class="bar"><button class="btn ghost" id="dBack">← <span data-i="backOverview"></span></button>
        <input type="date" id="dFrom" aria-label="From"><input type="date" id="dTo" aria-label="To">
        <select id="dEmp" aria-label="Employee"></select><select id="dType" aria-label="Type"></select><select id="dProd" aria-label="Product"></select>
        <button class="btn" id="dGo" data-i="search"></button><span class="upd" id="dUpd"></span></div>
      <div id="dHead"></div>
      <div class="card"><h3 style="margin:0 0 2px;font-size:15.5px" data-i="dMapT"></h3><p style="margin:0 0 8px;font-size:13px;color:var(--muted)" data-i="dMapS"></p>
        <div id="dMap" style="height:380px;border-radius:10px;border:1px solid var(--line)"></div><div class="legend" id="dLegend"></div></div>
      <div class="sec"><h3 data-i="dMovesT"></h3><div class="box" id="dMoves"></div></div>
      <div class="two sec"><div><h3 data-i="dCountsT"></h3><div class="box" id="dCounts"></div></div><div><h3 data-i="dDispT"></h3><div class="box" id="dDisp"></div></div></div>
      <div class="sec"><h3 data-i="dMonthsT"></h3><div class="box" id="dMonths"></div></div>
    </section>

    <section id="pStockq" class="hidden">
      <div class="bar"><button class="btn ghost" id="sqRefresh" data-i="refresh"></button><span class="upd" id="sqUpd"></span></div>
      <div id="sq"></div>
      <div class="sec"><h3 data-i="sqHistT"></h3><div class="box" id="sqHist"></div></div>
    </section>

    <section id="pClose" class="hidden">
      <div class="bar"><input type="month" id="cMonth" aria-label="Month"><button class="btn ghost" id="cRefresh" data-i="refresh"></button><span class="upd" id="cUpd"></span></div>
      <p style="font-size:13.5px;color:var(--ink-2);margin:0 0 10px" data-i="closeS"></p>
      <div class="box" id="cTable"></div>
    </section>

    <section id="pSales" class="hidden">
      <div class="bar"><input type="month" id="saMonth" aria-label="Month"><button class="btn ghost" id="saRefresh" data-i="refresh"></button><button class="btn ghost" id="saCsv" data-i="csv"></button><span class="upd" id="saUpd"></span></div>
      <p style="font-size:13.5px;color:var(--ink-2);margin:0 0 10px" data-i="salesS"></p>
      <div class="box" id="saTable"></div>
      <div class="sec" id="saNoDl1"></div>
    </section>

    <section id="pQueue" class="hidden">
      <div class="bar"><button class="btn ghost" id="qRefresh" data-i="refresh"></button><span class="upd" id="qUpd"></span></div>
      <div id="queue"></div>
    </section>

    <section id="pSearch" class="hidden">
      <div class="bar">
        <input type="date" id="sFrom" aria-label="From"><input type="date" id="sTo" aria-label="To">
        <select id="sEmp" aria-label="Employee"></select>
        <select id="sStatus" aria-label="Status">
          <option value="" data-i="fAll"></option><option value="am" data-i="fAm"></option>
          <option value="v" data-i="fVoid"></option><option value="pend" data-i="fPend"></option>
        </select>
        <button class="btn" id="sGo" data-i="search"></button>
        <span class="upd" id="sUpd"></span>
      </div>
      <div class="box" id="results"></div>
    </section>

    <section id="pHistory" class="hidden">
      <div class="bar">
        <select id="hStatus" aria-label="Status">
          <option value="" data-i="fAllDecided"></option><option value="Approved" data-i="sApproved"></option>
          <option value="Rejected" data-i="sRejected"></option><option value="Cancelled" data-i="sCancelled"></option>
        </select>
        <span class="upd" data-i="last60"></span>
      </div>
      <div class="box" id="history"></div>
    </section>
  </div>
</div>

<!-- direct fix -->
<div class="modal" id="fixModal">
  <div class="in">
    <h2 data-i="fixTitle"></h2>
    <p style="margin:0;color:var(--muted);font-size:14px" id="fixEntry"></p>
    <label class="opt" data-k="amend"><input type="radio" name="fk" value="amend"><span data-i="fixAmend"></span></label>
    <div id="fixQtyWrap" class="hidden"><input type="text" id="fixQty" inputmode="numeric" maxlength="4" placeholder="0"></div>
    <label class="opt" data-k="void"><input type="radio" name="fk" value="void"><span data-i="fixVoid"></span></label>
    <textarea id="fixNote" maxlength="500" data-ph="fixNotePh"></textarea>
    <p style="font-size:13px;color:var(--muted)" data-i="fixHow"></p>
    <div class="hist" id="fixHist"></div>
    <div class="err" id="fixErr"></div>
    <div class="acts"><button class="btn" id="fixSend" data-i="fixSend" disabled></button><button class="btn ghost" id="fixClose" data-i="close"></button></div>
  </div>
</div>
<div class="modal" id="rsModal"><div class="in">
  <h2 id="rsTitle"></h2><p style="margin:0;color:var(--muted);font-size:14px" id="rsSub"></p>
  <textarea id="rsNote" maxlength="500"></textarea>
  <div class="err" id="rsErr"></div>
  <div class="acts"><button class="btn" id="rsYes"></button><button class="btn ghost" id="rsNo" data-i="close"></button></div>
</div></div>
<div class="toast" id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

<script>

  $('qRefresh').disabled = false;
}
$('qRefresh').onclick = loadQueue;
const reasonTxt = c => t('rs_'+(c.reason||'other'));
function changeHtml(c){
  return c.type==='void' ? `<span class="pill bad">${esc(t('voidEntry'))}</span> <s>${nf(c.oldBoxes)}</s> ${esc(t('boxes'))}`
       : `${nf(c.oldBoxes)}<span class="arrow">→</span>${nf(c.newBoxes)} <span style="font-size:15px;font-weight:600;color:var(--muted)">${esc(t('boxes'))}</span>`;
}
function renderQueue(){

    const e = c.entry || {}, own = c.requestedBy === session.username;
    return `<div class="card ${c.large?'large':''}" data-id="${esc(c.id)}">

      <div class="change">${changeHtml(c)}</div>
      <div class="kv">
        <span>${esc(t('employee'))}</span><span><b>${esc(e.n||c.owner)}</b> @${esc(c.owner)}</span>
        <span>${esc(t('entryTime'))}</span><span>${e.t?esc(dt(e.t)):''}${e.off?` · <i>${esc(t('sentLater'))}</i>`:''}</span>
        <span>${esc(t('location'))}</span><span>${e.lat?`<a href="${mapUrl(e)}" target="_blank" rel="noopener">${esc(t('openMap'))}</a> · ${esc(t('gps'))} ±${e.acc} m ${esc(e.g)}`:''}</span>
        <span>${esc(t('reason'))}</span><span>${esc(reasonTxt(c))}</span>
        <span>${esc(t('reqBy'))}</span><span>@${esc(c.requestedBy)}</span>
      </div>
      ${c.note?`<div class="note">“${esc(c.note)}”</div>`:''}
      <div class="ctx"><a href="#" data-ctx="${esc(c.id)}">${esc(t('sameDay'))}</a><div data-ctxbox="${esc(c.id)}"></div></div>
      ${own ? `<div class="own">${esc(t('ownReq'))}</div>` : `
      <textarea data-note="${esc(c.id)}" placeholder="${esc(t('notePh'))}"></textarea>
      <div class="acts"><button class="btn good" data-ap="${esc(c.id)}">✓ ${esc(t('approve'))}</button><button class="btn bad" data-rj="${esc(c.id)}">✕ ${esc(t('reject'))}</button></div>`}
      <div class="err" data-err="${esc(c.id)}"></div>
    </div>`;
  }).join('');
  $('queue').querySelectorAll('[data-ap]').forEach(b => b.onclick = () => decide(b.dataset.ap, 'approve'));
  $('queue').querySelectorAll('[data-rj]').forEach(b => b.onclick = () => decide(b.dataset.rj, 'reject'));
  $('queue').querySelectorAll('[data-ctx]').forEach(a => a.onclick = ev => { ev.preventDefault(); showContext(a.dataset.ctx); });
}
async function decide(id, decision){
  const note = (document.querySelector(`[data-note="${id}"]`)||{}).value?.trim() || '';
  const errEl = document.querySelector(`[data-err="${id}"]`);
  if (decision==='reject' && !note) { errEl.textContent = t('needNote'); return; }
  document.querySelectorAll(`[data-ap="${id}"],[data-rj="${id}"]`).forEach(b => b.disabled = true);
  try {
    const r = await api({action:'review',token:session.token,requestId:id,decision,note});
    if (authFail(r)) return;
    if (r.ok) { toast(decision==='approve'?t('doneApprove'):t('doneReject')); R = null; await loadQueue(); return; }
    errEl.textContent = t('err_'+r.error);
  } catch(e) { errEl.textContent = t('errNet'); }
  document.querySelectorAll(`[data-ap="${id}"],[data-rj="${id}"]`).forEach(b => b.disabled = false);
}
async function showContext(id){
  const c = Q.requests.find(x => x.id===id), box = document.querySelector(`[data-ctxbox="${id}"]`);
  if (!c || !c.entry) return;
  const k = dkey(c.entry.t);
  box.textContent = '…';
  try {
    const r = await api({action:'entries',token:session.token,from:k,to:k});
    if (authFail(r)) return;
    const rows = r.rows.filter(x => x.u===c.owner).sort((a,b)=>a.t-b.t);
    box.innerHTML = rows.length<=1 ? `<p style="color:var(--muted)">${esc(t('ctxNone'))}</p>` :
      `<table>${rows.map(x => `<tr class="${x.id===c.entryId?'me':''}"><td>${hm(x.t)}</td><td><b>${nf(x.b)}</b> ${esc(t('boxes'))}${x.v?' · '+esc(t('voided')):''}</td><td>±${x.acc} m</td><td><a href="${mapUrl(x)}" target="_blank" rel="noopener">↗</a></td></tr>`).join('')}</table>`;
  } catch(e) { box.textContent = t('errNet'); }
}

function statusPills(r){

  $('dCounts').innerHTML=cs.length?`<table class="t"><thead><tr><th>${esc(t('cTimeReal'))}</th><th>${esc(t('cWho'))}</th><th>${esc(t('cKind'))}</th><th>${esc(t('cProd'))}</th><th class="num">${esc(t('cCounted'))}</th><th class="num">${esc(t('cSystem'))}</th><th class="num">${esc(t('cDiff'))}</th><th>${esc(t('cStatus'))}</th></tr></thead><tbody>${
    cs.map(c=>`<tr><td>${esc(dt(c.t))}${c.eff!==dkey(c.t)?`<div style="font-size:11.5px;color:var(--muted)">→ ${esc(fdate(c.eff))}</div>`:''}</td><td>${esc(c.n)}</td><td>${esc(t('k_'+c.kind))}${c.month?' '+esc(mlabel(c.month)):''}</td><td>${c.p==='PINK'?'Pink':'SH'}</td>
      <td class="num"><b>${nf(c.counted)}</b></td><td class="num">${nf(c.system)}</td><td class="num ${c.diff?'neg':''}">${c.diff>0?'+':''}${nf(c.diff)}</td><td>${esc(c.status)}</td></tr>`).join('')}</tbody></table>`:`<div class="empty">${esc(t('none'))}</div>`;
  $('dDisp').innerHTML=DT.dispatches.length?`<table class="t"><thead><tr><th>${esc(t('cTimeReal'))}</th><th>${esc(t('cNoteNo'))}</th><th>${esc(t('cProd'))}</th><th class="num">${esc(t('cSent'))}</th><th class="num">${esc(t('cRecv'))}</th><th>${esc(t('cStatus'))}</th></tr></thead><tbody>${
    DT.dispatches.map(x=>`<tr><td>${esc(dt(x.createdAt))}</td><td>${esc(x.noteNo)}</td><td>${x.p==='PINK'?'Pink':'SH'}</td><td class="num">${nf(x.boxes)}</td><td class="num ${x.receivedQty!=null&&x.receivedQty!==x.boxes?'neg':''}">${x.receivedQty==null?'':nf(x.receivedQty)}</td><td>${esc(x.status)}${x.receivedBy?' · @'+esc(x.receivedBy):''}</td></tr>`).join('')}</tbody></table>`:`<div class="empty">${esc(t('none'))}</div>`;
  $('dMonths').innerHTML=DT.months.length?`<table class="t"><thead><tr><th>${esc(t('cMonth'))}</th><th>${esc(t('cStatus'))}</th><th>${esc(t('cCountedBy'))}</th><th>${esc(t('cLockedBy'))}</th><th>${esc(t('cClose'))}</th></tr></thead><tbody>${
    DT.months.map(x=>`<tr><td>${esc(mlabel(x.month))}</td><td>${esc(t('ms_'+x.status))}</td><td>${x.countedBy?'@'+esc(x.countedBy)+' · '+esc(dt(x.countedAt)):''}</td><td>${x.lockedBy?'@'+esc(x.lockedBy)+' · '+esc(dt(x.lockedAt)):''}${x.reopenReason?'<div style="font-size:12px;color:var(--warn)">↺ '+esc(x.reopenReason)+'</div>':''}</td><td>${x.closeSH!=null?nf(x.closeSH)+' / '+nf(x.closePINK):''}</td></tr>`).join('')}</tbody></table>`:`<div class="empty">${esc(t('none'))}</div>`;
}
/* ---------- stock approvals ---------- */
$('sqRefresh').onclick=()=>loadSQ();
async function loadSQ(quiet){
  try{ const r=await api({action:'stock_queue',token:session.token}); if(authFail(r)) return; if(r.ok){ SQ=r; renderSQ(); } }catch(e){ if(!quiet) toast(t('errNet')); }
}
function renderSQ(){
  const pend=SQ.items.filter(x=>x.status==='Pending').sort((a,b)=>a.t-b.t);
  $('sqCnt').textContent=pend.length; $('sqCnt').classList.toggle('hidden',!pend.length);
  $('sqUpd').textContent=t('updated',{t:hm(SQ.generated)});
  $('sq').innerHTML=pend.length?pend.map(x=>{ const own=x.u===SQ.me, opening=(x.flags||'').includes('opening');
    return `<div class="card ${Math.abs(x.qty)>=200?'large':''}"><div class="rq-h"><span><span class="rq-id">${esc(t('t_'+x.type))}</span> <span class="pill info">${esc(x.dl1)} · ${esc(x.dl1Name)}</span>${opening?` <span class="pill warn">${esc(t('opening'))}</span>`:''}${x.count&&x.count.kind==='eom'?` <span class="pill warn">${esc(t('k_eom'))} ${esc(mlabel(x.count.month||''))}</span>`:''}</span>
      <span style="color:var(--muted);font-size:13px">${esc(dt(x.t))}</span></div>
      <div class="change">${x.qty>0?'+':''}${nf(x.qty)} <span style="font-size:15px;font-weight:600;color:var(--muted)">${esc(t('boxes'))} · ${x.p==='PINK'?'Super Horse Pink':'Super Horse Energy Drink'}</span></div>
      ${x.count?`<div class="cmpl"><span>${esc(t('cCounted'))}</span><span>${esc(t('cSystem'))}</span><span>${esc(t('cDiff'))}</span><b>${nf(x.count.counted)}</b><b>${nf(x.count.system)}</b><b class="neg">${x.qty>0?'+':''}${nf(x.qty)}</b></div>`:''}
      <div class="kv"><span>${esc(t('employee'))}</span><span><b>${esc(x.n)}</b> @${esc(x.u)}</span>
        <span>${esc(t('location'))}</span><span>${x.lat?`<a href="${mapUrl(x)}" target="_blank" rel="noopener">${esc(t('openMap'))}</a> · ±${x.acc} m`:''} ${flagChips(x.flags)}</span>
        <span>${esc(t('cEff'))}</span><span>${esc(fdate(x.eff))}</span>
        <span>${esc(t('nowStock'))}</span><span>${nf(x.balance)}</span></div>
      ${x.note?`<div class="note">“${esc(x.note)}”</div>`:''}
      ${own?`<div class="own">${esc(t('ownStock'))}</div>`:`<textarea data-snote="${esc(x.id)}" placeholder="${esc(t('notePh'))}"></textarea>
      <div class="acts"><button class="btn good" data-sap="${esc(x.id)}">✓ ${esc(t('approve'))}</button><button class="btn bad" data-srj="${esc(x.id)}">✕ ${esc(t('reject'))}</button></div>`}
      <div class="err" data-serr="${esc(x.id)}"></div></div>`; }).join(''):`<div class="card empty">${esc(t('sqNone'))}</div>`;
  $('sq').querySelectorAll('[data-sap]').forEach(b=>b.onclick=()=>stockDecide(b.dataset.sap,'approve'));
  $('sq').querySelectorAll('[data-srj]').forEach(b=>b.onclick=()=>stockDecide(b.dataset.srj,'reject'));
  const done=SQ.items.filter(x=>x.status!=='Pending').sort((a,b)=>(b.reviewedAt||0)-(a.reviewedAt||0));
  const scls={Posted:'good',Rejected:'bad',Cancelled:'mute'};
  $('sqHist').innerHTML=done.length?`<table class="t"><thead><tr><th>${esc(t('cTimeReal'))}</th><th>DL1</th><th>${esc(t('cWho'))}</th><th>${esc(t('cType'))}</th><th class="num">${esc(t('cQty'))}</th><th>${esc(t('cStatus'))}</th><th>${esc(t('cRev'))}</th><th>${esc(t('cNote'))}</th></tr></thead><tbody>${
    done.map(x=>`<tr><td>${esc(dt(x.t))}</td><td>${esc(x.dl1)}</td><td>${esc(x.n)}</td><td>${esc(t('t_'+x.type))}</td><td class="num">${x.qty>0?'+':''}${nf(x.qty)} ${x.p==='PINK'?'Pink':'SH'}</td><td><span class="pill ${scls[x.status]||'mute'}">${esc(t('s_'+x.status))}</span></td><td>${x.reviewedBy?'@'+esc(x.reviewedBy):''}</td><td style="white-space:normal;min-width:160px">${esc([x.note,x.reviewNote].filter(Boolean).join(' · '))}</td></tr>`).join('')}</tbody></table>`:`<div class="empty">${esc(t('none'))}</div>`;
}
async function stockDecide(id,decision){
  const note=(document.querySelector(`[data-snote="${id}"]`)||{}).value?.trim()||'', el=document.querySelector(`[data-serr="${id}"]`);
  if(decision==='reject'&&!note){ el.textContent=t('needNote'); return; }
  document.querySelectorAll(`[data-sap="${id}"],[data-srj="${id}"]`).forEach(b=>b.disabled=true);
  try{ const r=await api({action:'stock_review',token:session.token,id,decision,note}); if(authFail(r)) return;
    if(r.ok){ toast(decision==='approve'?t('doneApprove'):t('doneReject')); O=null; CL=null; await loadSQ(); return; } el.textContent=errS(r.error); }catch(e){ el.textContent=t('errNet'); }
  document.querySelectorAll(`[data-sap="${id}"],[data-srj="${id}"]`).forEach(b=>b.disabled=false);
}
/* ---------- month close ---------- */
(()=>{ const k=todayK(), d=Number(k.slice(8,10)); const prev=new Date(Date.UTC(+k.slice(0,4),+k.slice(5,7)-2,1)).toISOString().slice(0,7); $('cMonth').value=d<=5?prev:ym(k); })();
$('cMonth').onchange=()=>loadClose(); $('cRefresh').onclick=()=>loadClose();
async function loadClose(){
  try{ const r=await api({action:'overview',token:session.token,month:$('cMonth').value}); if(authFail(r)) return; if(r.ok){ CL=r; renderClose(); } }catch(e){ toast(t('errNet')); }
}
function renderClose(){
  const m=CL.month, admin=(session.role==='admin');
  $('cUpd').textContent=mlabel(m)+' · '+t('updated',{t:hm(CL.generated)});
  $('cTable').innerHTML=`<table class="t"><thead><tr><th>DL1</th><th>${esc(t('cStatus'))}</th><th>${esc(t('cCountedBy'))}</th><th>${esc(t('cLockedBy'))}</th><th class="num">${esc(t('cClose'))}</th><th></th></tr></thead><tbody>${
    CL.dl1s.map(d=>{ const st=d.month||'Open', mi=d.monthInfo||{}, pend=d.pendingCount||0;
      const btn=st==='Counted'?`<button class="btn good" style="min-height:30px;padding:4px 10px" data-close="${esc(d.code)}" ${pend?'disabled':''}>${esc(t('closeBtn'))}</button>${pend?`<div style="font-size:12px;color:var(--warn)">${esc(t('needPend'))} (${pend})</div>`:''}`
        :st==='Locked'&&admin?`<button class="btn ghost" style="min-height:30px;padding:4px 10px" data-reopen="${esc(d.code)}">${esc(t('reopenBtn'))}</button>`:'';
      return `<tr><td><b>${esc(d.code)}</b> <span style="color:var(--muted)">${esc(d.name)}</span></td><td><span class="fl ${st==='Locked'?'info':st==='Counted'?'warn':'mute'}">${esc(t('ms_'+st))}</span></td>
        <td>${mi.countedBy?'@'+esc(mi.countedBy)+' · '+esc(dt(mi.countedAt)):''}</td><td>${mi.lockedBy?'@'+esc(mi.lockedBy)+' · '+esc(dt(mi.lockedAt)):''}${mi.reopenReason?'<div style="font-size:12px;color:var(--warn)">↺ '+esc(mi.reopenReason)+'</div>':''}</td>
        <td class="num">${st==='Locked'&&mi.closeSH!=null?nf(mi.closeSH)+' / '+nf(mi.closePINK):nf(d.per.SH.close)+' / '+nf(d.per.PINK.close)}</td><td>${btn}</td></tr>`; }).join('')}</tbody></table>`;
  $('cTable').querySelectorAll('[data-close]').forEach(b=>b.onclick=async()=>{
    const d=CL.dl1s.find(x=>x.code===b.dataset.close);
    if(!confirm(t('closeConfirm',{m:mlabel(m),d:d.code,a:nf(d.per.SH.close),b:nf(d.per.PINK.close)}))) return;
    b.disabled=true;
    try{ const r=await api({action:'month_close',token:session.token,dl1:d.code,month:m}); if(authFail(r)) return; if(r.ok){ toast(t('closed')); O=null; await loadClose(); } else { toast(errS(r.error)); b.disabled=false; } }catch(e){ toast(t('errNet')); b.disabled=false; }
  });
  $('cTable').querySelectorAll('[data-reopen]').forEach(b=>b.onclick=()=>{
    rs={dl1:b.dataset.reopen,month:m}; $('rsTitle').textContent=t('reopenT',{m:mlabel(m),d:rs.dl1}); $('rsSub').textContent=t('reopenS');
    $('rsNote').value=''; $('rsErr').textContent=''; $('rsYes').textContent=t('reopenBtn'); $('rsModal').style.display='flex'; });
}
$('rsNo').onclick=()=>$('rsModal').style.display='none';
$('rsYes').onclick=async()=>{
  const reason=$('rsNote').value.trim(); if(!reason){ $('rsErr').textContent=t('err_note_required'); return; }
  $('rsYes').disabled=true;
  try{ const r=await api({action:'month_reopen',token:session.token,dl1:rs.dl1,month:rs.month,reason}); if(authFail(r)) return;
    if(r.ok){ $('rsModal').style.display='none'; toast(t('reopened')); O=null; await loadClose(); } else $('rsErr').textContent=errS(r.error); }catch(e){ $('rsErr').textContent=t('errNet'); }
  $('rsYes').disabled=false;
};
/* ---------- sales by team & employee ---------- */
$('saMonth').value=ym(todayK()); $('saMonth').onchange=()=>loadSales(); $('saRefresh').onclick=()=>loadSales();
async function loadSales(){
  try{ const r=await api({action:'sales_report',token:session.token,month:$('saMonth').value}); if(authFail(r)) return; if(r.ok){ SA=r; renderSales(); } }catch(e){ toast(t('errNet')); }
}
function salesRows(){
  const by=new Map(); SA.rows.forEach(r=>{ if(!by.has(r.dl1)) by.set(r.dl1,{name:r.dl1Name,rows:[]}); by.get(r.dl1).rows.push(r); });
  return [...by].sort((a,b)=>a[0].localeCompare(b[0]));
}
function renderSales(){
  $('saUpd').textContent=mlabel(SA.month)+' · '+t('updated',{t:hm(SA.generated)});
  const tot=r=>r.dropoff.SH+r.dropoff.PINK+r.dl1sale.SH+r.dl1sale.PINK, G={a:0,b:0,c:0,d:0,e:0};
  let h=`<table class="t"><thead><tr><th>DL1</th><th>${esc(t('employee'))}</th><th class="num">${esc(t('cDropSH'))}</th><th class="num">${esc(t('cDropP'))}</th><th class="num">${esc(t('cSaleSH'))}</th><th class="num">${esc(t('cSaleP'))}</th><th class="num">${esc(t('cTotal'))}</th><th class="num">${esc(t('cDays'))}</th><th class="num">${esc(t('cEntries'))}</th></tr></thead><tbody>`;
  salesRows().forEach(([code,g])=>{ const S2={a:0,b:0,c:0,d:0,e:0};
    g.rows.sort((a,b)=>tot(b)-tot(a)).forEach(r=>{ S2.a+=r.dropoff.SH;S2.b+=r.dropoff.PINK;S2.c+=r.dl1sale.SH;S2.d+=r.dl1sale.PINK;S2.e+=tot(r);
      h+=`<tr><td>${esc(code)}</td><td><b>${esc(r.n)}</b> <span style="color:var(--muted)">@${esc(r.u)}</span></td><td class="num">${nf(r.dropoff.SH)}</td><td class="num">${nf(r.dropoff.PINK)}</td><td class="num">${nf(r.dl1sale.SH)}</td><td class="num">${nf(r.dl1sale.PINK)}</td><td class="num"><b>${nf(tot(r))}</b></td><td class="num">${r.days}</td><td class="num">${r.entries}</td></tr>`; });
    h+=`<tr class="sub"><td colspan="2">${esc(t('subtotal',{d:code+' · '+g.name}))}</td><td class="num">${nf(S2.a)}</td><td class="num">${nf(S2.b)}</td><td class="num">${nf(S2.c)}</td><td class="num">${nf(S2.d)}</td><td class="num">${nf(S2.e)}</td><td></td><td></td></tr>`;
    G.a+=S2.a;G.b+=S2.b;G.c+=S2.c;G.d+=S2.d;G.e+=S2.e; });
  h+=`<tr class="sub"><td colspan="2">${esc(t('grand'))}</td><td class="num">${nf(G.a)}</td><td class="num">${nf(G.b)}</td><td class="num">${nf(G.c)}</td><td class="num">${nf(G.d)}</td><td class="num">${nf(G.e)}</td><td></td><td></td></tr></tbody></table>`;
  $('saTable').innerHTML=SA.rows.length?h:`<div class="empty">${esc(t('none'))}</div>`;
  $('saNoDl1').innerHTML=SA.noDl1.length?`<h3>${esc(t('noDl1T'))}</h3><div class="box"><table class="t"><thead><tr><th>${esc(t('employee'))}</th><th class="num">SH</th><th class="num">Pink</th></tr></thead><tbody>${SA.noDl1.map(r=>`<tr><td>${esc(r.n)} <span style="color:var(--muted)">@${esc(r.u)}</span></td><td class="num">${nf(r.SH)}</td><td class="num">${nf(r.PINK)}</td></tr>`).join('')}</tbody></table></div>`:'';
}
$('saCsv').onclick=()=>{
  if(!SA) return;
  const q=v=>{ const s=String(v??''); return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; };
  const lines=[['Month','DL1','DL1 Name','Username','Employee','Drop-off SH','Drop-off Pink','Sold at DL1 SH','Sold at DL1 Pink','Total','Active days','Entries'].join(',')];
  SA.rows.forEach(r=>lines.push([SA.month,r.dl1,r.dl1Name,r.u,r.n,r.dropoff.SH,r.dropoff.PINK,r.dl1sale.SH,r.dl1sale.PINK,r.dropoff.SH+r.dropoff.PINK+r.dl1sale.SH+r.dl1sale.PINK,r.days,r.entries].map(q).join(',')));
  SA.noDl1.forEach(r=>lines.push([SA.month,'','',r.u,r.n,r.SH,r.PINK,0,0,r.SH+r.PINK,'',''].map(q).join(',')));
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob(['﻿'+lines.join('\n')],{type:'text/csv;charset=utf-8'})); a.download=`SalesData_sales_${SA.month}.csv`; document.body.appendChild(a); a.click(); a.remove();
};
fillTypeSel();

/* boot */
$('uName').value = S.get('sd_mgr_user','');
initSearch(); applyLang();
if (session && Date.now() < session.expires) showApp(); else { session=null; S.del('sd_mgr_session'); showLogin(); }
setInterval(() => { if (!document.hidden && session) loadQueue(); }, 3*60e3);
</script>
